# deploy/custom-filter/01-buildconfig.yaml — Step 16.4 (openshift-setup.md)
# In-cluster image build for a custom Kafka Proxy filter, following the Camel
# pattern (Step 14.4): binary (from-dir) build with a Docker strategy. The
# payload is the local Maven filter project (from the kroxylicious-filter-archetype)
# plus the Dockerfile from this directory — start it with:
#
#   cp deploy/custom-filter/Dockerfile sample-filter/
#   oc apply -f 01-buildconfig.yaml
#   oc start-build kroxylicious-custom-filter --from-dir=sample-filter -n kafka-filter-dev --follow
#
# The operator is then pointed at the image with (Step 16.5):
#
#   oc -n kafka-proxy set env deploy/kafka-proxy \
#     KROXYLICIOUS_IMAGE=image-registry.openshift-image-registry.svc:5000/kafka-filter-dev/kroxylicious-custom-filter:0.25.1
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka-filter-dev
  annotations:
    openshift.io/description: "Custom Kafka Proxy filter development"
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: kroxylicious-custom-filter
  namespace: kafka-filter-dev
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: kroxylicious-custom-filter
  namespace: kafka-filter-dev
  labels:
    app: kroxylicious-custom-filter
spec:
  output:
    to:
      kind: ImageStreamTag
      name: kroxylicious-custom-filter:0.25.1
  strategy:
    dockerStrategy:
      dockerfilePath: Dockerfile
  source:
    type: Binary
  triggers: []
