# deploy/keycloak/03-keycloak.yaml — Step 1.3 (openshift-setup.md)
# Keycloak deployment. hostname is left unpopulated so the operator assigns
# one via the openshift-default IngressClass; the resulting Route hostname is
# what <KEYCLOAK_HOST> refers to elsewhere (console OIDC login)
# clients, console OIDC). Discover it after Ready:
#   oc get routes -n kafka-auth
# (the operator derives it as <cr-name>-ingress-<namespace>.<cluster-domain>)
#
# TLS material is created with oc create (kept out of git), see deploy/README.md.
# IMPORTANT: the certificate MUST carry a SAN for the route hostname — the
# broker-side JWKS fetch validates the hostname against the cert (a plain CN
# is not enough and the broker will fail to start):
#   openssl req -new -newkey rsa:2048 -nodes \
#     -subj '/CN=kafka-auth/O=Kafka Auth./C=US' \
#     -addext "subjectAltName=DNS:<KEYCLOAK_HOST>" \
#     -keyout key.pem -x509 -days 365 -out certificate.pem
#   oc create secret tls keycloak-tls-secret --cert certificate.pem --key key.pem -n kafka-auth
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: kafka-auth
spec:
  instances: 1
  db:
    vendor: postgres
    host: postgres-db
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    tlsSecret: keycloak-tls-secret
  hostname:
    # unpopulated → operator assigns a hostname via the openshift-default IngressClass
  ingress:
    className: openshift-default
  proxy:
    headers: xforwarded
  # Step 15.6 — expose Prometheus metrics on the management port (9000);
  # the operator then auto-creates a ServiceMonitor for user-workload monitoring.
  additionalOptions:
    - name: metrics-enabled
      value: "true"
