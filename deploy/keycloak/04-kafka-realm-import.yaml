# deploy/keycloak/04-kafka-realm-import.yaml — Step 2.4 (openshift-setup.md)
# Creates the `kafka` realm for the platform's OIDC consumers. Client secrets
# are inline for dev simplicity — do not commit rotated/real secrets this way.
#
# IMPORTANT: source deploy/env.sh before envsubst — the redirect URIs below
# embed ${OPENSHIFT_APPS_DOMAIN}, and envsubst replaces an UNSET variable with
# an empty string (verified live: the console login then fails with
# "Invalid parameter: redirect_uri").
#
# Keycloak IS wired to the Kafka data path: the tls listener (9093) requires
# SASL/OAUTHBEARER (Step 3.2, deploy/kafka/02-kafka.yaml) — the service-account
# clients below are the data-path credentials. Each workload obtains tokens
# with the client_credentials grant and authenticates through the proxy
# (SASL passthrough); the brokers validate the tokens against Keycloak's JWKS.
# Keycloak also serves the console's OIDC browser login (Step 8).
#
# Client usage map:
#   kafka-console       Console UI OIDC browser login            (Step 8.3)
#   kafka-console-kafka Console's Kafka connection (OAUTHBEARER) (Step 8.2)
#   kafka-bridge        HTTP Bridge Kafka connection             (Step 7.2)
#   camel-producer      Camel producer Kafka connection          (Step 9.3)
#   camel-consumer      Camel consumer Kafka connection          (Step 9.3)
#   demo-client         kcat/CLI smoke tests (Step 6.10)
#   (MirrorMaker 2 connects via the unauthenticated plain listener — no client
#    needed here, see docs/04-mirrormaker2.md)
#
# To use a client secret in a Deployment, create a Secret in the workload's
# namespace (Secrets cannot be referenced across namespaces) — the realm
# import does NOT create Kubernetes Secrets:
#   oc create secret generic camel-producer-oauth \
#     --from-literal=client-secret=camel-producer-secret -n kafka-producer
# Hardening: enable oauth.check.audience="true" on the broker listener and add
# an audience mapper (aud: kafka) to each client so tokens issued for other
# services are rejected.
apiVersion: k8s.keycloak.org/v2alpha1
kind: KeycloakRealmImport
metadata:
  name: kafka-realm-import
  namespace: kafka-auth
spec:
  keycloakCRName: keycloak
  realm:
    # strategy: OVERWRITE — re-imports update existing clients (their Secrets)
    # instead of Keycloak's default IGNORE, which would silently skip them.
    strategy: OVERWRITE
    realm: kafka
    # Realm client scope providing the `groups` claim (verified live, fixed:
    # the console's OIDC flow requests `openid email profile groups` at the
    # token exchange — without this scope the exchange fails with
    # "Invalid scopes" and the console login redirect-loops between
    # /api/auth/signin and Keycloak). The kafka-console client below attaches
    # it as a default client scope.
    clientScopes:
      - name: groups
        description: Group membership claims for the Streams for Apache Kafka Console role mapping
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: group-membership
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            consentRequired: false
            config:
              full.group.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: groups
      # Basic client scope — provides the `sub` claim (verified live, fixed:
      # a realm created purely by operator import has NO built-in default
      # client scopes, so tokens carry no `sub` — and the proxy's
      # SaslInspection filter derives the principal from the JWT `sub`).
      # Uses Keycloak's `oidc-sub-mapper`; a property mapper against the
      # `sub` user attribute does NOT work.
      - name: basic
        description: OpenID Connect scope for adding the basic claims (sub) to the token
        protocol: openid-connect
        attributes:
          include.in.token.scope: "false"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: sub
            protocol: openid-connect
            protocolMapper: oidc-sub-mapper
            consentRequired: false
            config:
              introspection.token.claim: "true"
              access.token.claim: "true"
      # Profile client scope — provides `preferred_username` (verified live,
      # fixed: without it Kafka's native OAuth login module rejects the token
      # client-side with "scope value must be non-empty"... and the Strimzi
      # broker-side validator cannot derive the username).
      - name: profile
        description: OpenID Connect built-in scope providing preferred_username
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: preferred_username
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            consentRequired: false
            config:
              user.attribute: username
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: preferred_username
              jsonType.label: String
      # Roles client scope — maps realm roles into the token (the registry's
      # role-based authz needs sr-admin in the registry-api service account's
      # token).
      - name: roles
        description: OpenID Connect scope for adding realm roles to the token
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "false"
        protocolMappers:
          - name: realm roles
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            consentRequired: false
            config:
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              multivalued: "true"
              claim.name: realm_access.roles
              jsonType.label: String
      # Email client scope — the Console's NextAuth browser flow requests
      # `openid email profile groups` (verified live, fixed: without an email
      # scope in the realm, Keycloak rejects the callback with
      # "Invalid scopes: openid email profile groups" and the console login
      # loops back to the sign-in page forever).
      - name: email
        description: "OpenID Connect built-in scope: email"
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "true"
          consent.screen.text: "${emailScopeConsentText}"
        protocolMappers:
          - name: email
            protocol: openid-connect
            protocolMapper: oidc-email-mapper
            consentRequired: false
            config:
              user.attribute: email
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
          - name: email verified
            protocol: openid-connect
            protocolMapper: oidc-usermodel-property-mapper
            consentRequired: false
            config:
              user.attribute: emailVerified
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
              claim.name: email_verified
              jsonType.label: boolean
    # Realm default client scopes — applied to every NEW client at creation
    # (verified live, fixed: an operator-imported realm starts with an EMPTY
    # default-client-scopes list, so imported clients get no `scope` or `sub`
    # claims at all). Existing clients are NOT back-filled — the kafka-console
    # client below lists them explicitly.
    defaultDefaultClientScopes:
      - basic
      - profile
      - roles
      - email
    enabled: true
    # Short-lived access tokens (5 min) — access stops quickly on revocation
    accessTokenLifespan: 300
    clients:
      # Console client — browser login (standard flow) for the Streams for
      # Apache Kafka Console UI (Step 8); redirect URI points at the
      # console's hostname (Step 8.2 spec.hostname)
      - clientId: kafka-console
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: kafka-console-secret
        standardFlowEnabled: true
        # Direct grants let the kafka-admin user fetch a token from the CLI
        # (password grant) with the same kafka-console client the console UI
        # uses — the realm's built-in admin-cli only issues a slim token
        # without realm roles, which the registry's role-based authz rejects.
        directAccessGrantsEnabled: true
        serviceAccountsEnabled: false
        redirectUris:
          - "https://kafka-console.${OPENSHIFT_APPS_DOMAIN}/*"
        # Explicit list (realm defaults do NOT back-fill existing clients):
        # groups for the console's role mapping, basic for `sub`, profile for
        # `preferred_username`, roles for realm roles (verified live, fixed:
        # with `groups` only the password-grant token carried no `sub`, so
        # SaslInspection could not derive the principal at the proxy), email
        # because the console's NextAuth requests `openid email profile
        # groups` and Keycloak rejects the callback without an email scope.
        defaultClientScopes:
          - groups
          - basic
          - profile
          - roles
          - email
      # Service-account clients — SASL/OAUTHBEARER credentials for the Kafka
      # data path (client_credentials grant). The service account's
      # preferred_username (service-account-<clientId>) becomes the Kafka
      # principal on the tls listener.
      - clientId: kafka-console-kafka
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: kafka-console-kafka-secret
        standardFlowEnabled: false
        serviceAccountsEnabled: true
      - clientId: kafka-bridge
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: kafka-bridge-secret
        standardFlowEnabled: false
        serviceAccountsEnabled: true
      - clientId: camel-producer
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: camel-producer-secret
        standardFlowEnabled: false
        serviceAccountsEnabled: true
      - clientId: camel-consumer
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: camel-consumer-secret
        standardFlowEnabled: false
        serviceAccountsEnabled: true
      # Apicurio Registry clients (Step 5.2): registry-api is the backend
      # client (OIDC token validation via JWKS); registry-ui is the public
      # browser client for the registry UI Route.
      - clientId: registry-api
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: registry-api-secret
        standardFlowEnabled: false
        serviceAccountsEnabled: true
      - clientId: registry-ui
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        serviceAccountsEnabled: false
        redirectUris:
          - "https://registry-ui.${OPENSHIFT_APPS_DOMAIN}/*"
        webOrigins:
          - "https://registry-ui.${OPENSHIFT_APPS_DOMAIN}"
      - clientId: demo-client
        enabled: true
        protocol: openid-connect
        publicClient: false
        secret: demo-client-secret
        standardFlowEnabled: false
        serviceAccountsEnabled: true
    # Realm roles for Apicurio Registry role-based authorization (Step 5.2):
    # sr-admin grants full registry access (assigned to the kafka-admin user
    # and to the registry-api service account, whose token must carry the
    # role for writes); sr-developer/sr-readonly for developers/readers.
    roles:
      realm:
        - name: sr-admin
        - name: sr-developer
        - name: sr-readonly
    # Note: the read-along `demo` console-login user was removed — log in to
    # the console as kafka-admin. Manage real users through your identity
    # source.
    users:
      # Cluster administrator (dev): full access to the Apicurio Registry
    # (sr-admin role), the Kafka Console (subjects mapping in the Console
    # CR), and the Kafka cluster itself (no authorization block — all
    # authenticated principals have full cluster access).
    # Plain demo users (created via the admin API live too — the import is
      # skipped when the realm exists): password grants via the kafka-console
      # client. No realm roles — the proxy ACLs deny them until rules are
      # added (otherwise deny). Every user carries DUMMY firstName/lastName
      # (and email) values: Keycloak's default user profile marks these
      # required for the `user` role, and without them VERIFY_PROFILE fires
      # at first login ("Account is not fully set up") — the values here
      # satisfy the profile so first logins work unchanged.
      - username: kafka-user-A
        enabled: true
        firstName: Kafka User A
        lastName: Demo
        email: kafka-user-a@example.com
        emailVerified: true
        credentials:
          - type: password
            value: password-a
      - username: kafka-user-B
        enabled: true
        firstName: Kafka User B
        lastName: Demo
        email: kafka-user-b@example.com
        emailVerified: true
        credentials:
          - type: password
            value: password-b
      - username: kafka-user-C
        enabled: true
        firstName: Kafka User C
        lastName: Demo
        email: kafka-user-c@example.com
        emailVerified: true
        credentials:
          - type: password
            value: password-c
      - username: kafka-admin
        enabled: true
        # Dummy profile values (see the note above): required by the default
        # user profile — without them VERIFY_PROFILE fires at first login and
        # password grants fail with "Account is not fully set up" (verified
        # live in Step 5.2).
        firstName: Kafka
        lastName: Admin
        email: kafka-admin@example.com
        emailVerified: true
        credentials:
          - type: password
            value: openshift
        realmRoles:
          - sr-admin
          # default-roles-kafka is REQUIRED: it brings the `account` client
          # roles that put `aud: account` in the token — broker-side JWT
          # validation rejects tokens with no aud claim ("No Audience (aud)
          # claim present", verified live). Assigned via the admin API live too.
          - default-roles-kafka
      # NOTE: do NOT declare `service-account-registry-api` here — Keycloak
      # auto-creates the service-account user when the client's
      # serviceAccountsEnabled is on, and an explicit entry collides
      # (duplicate (realm_id, username) → ModelDuplicateException, import
      # fails). Assign the sr-admin role to the SA via the admin API
      # instead (verified live in Step 5.2).
