# deploy/keycloak/02-postgres.yaml — Step 2.2 (openshift-setup.md)
# PostgreSQL for Keycloak, persisted via a volumeClaimTemplate (gp3-csi by
# default). The operator does not manage the database. Previously ephemeral
# (emptyDir): the kafka realm was wiped on every pod recreation (node reboot,
# sandbox restart) and the KeycloakRealmImport CR — which reports Done=True —
# never re-ran, crash-looping every OAuth client. With persistence the realm
# survives pod recreation (verified live: migrated from an emptyDir with a
# pg_dump/pg_restore cycle; the realm and all clients came back untouched).
# A volumeClaimTemplate cannot be added to an existing StatefulSet — migrate
# with pg_dump first, then delete + re-apply this file and pg_restore.
#
# The DB credentials are stored in a Secret (created with oc create, see
# deploy/README.md) rather than committed here:
#   oc create secret generic keycloak-db-secret \
#     --from-literal=username=testuser --from-literal=password=testpassword \
#     -n kafka-auth
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-db
  namespace: kafka-auth
spec:
  serviceName: postgresql-db-service
  selector:
    matchLabels:
      app: postgresql-db
  replicas: 1
  template:
    metadata:
      labels:
        app: postgresql-db
    spec:
      containers:
        - name: postgresql-db
          image: postgres:15
          volumeMounts:
            - mountPath: /data
              name: keycloak-postgresql-data
          env:
            - name: POSTGRES_USER
              value: testuser
            - name: POSTGRES_PASSWORD
              value: testpassword
            - name: PGDATA
              value: /data/pgdata
            - name: POSTGRES_DB
              value: keycloak
  volumeClaimTemplates:
    - metadata:
        name: keycloak-postgresql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: kafka-auth
spec:
  selector:
    app: postgresql-db
  ports:
    - port: 5432
      targetPort: 5432
