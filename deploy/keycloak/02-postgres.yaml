# deploy/keycloak/02-postgres.yaml — Step 1.2 (openshift-setup.md)
# Dev-only ephemeral PostgreSQL for Keycloak (the operator does not manage the
# database). Data is lost on pod restart — use a persistent/supported DB for
# anything beyond development.
#
# The DB credentials are stored in a Secret (created with oc create, see
# deploy/README.md) rather than committed here:
#   oc create secret generic keycloak-db-secret \
#     --from-literal=username=testuser --from-literal=password=testpassword \
#     -n kafka-auth
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-db
  namespace: kafka-auth
spec:
  serviceName: postgresql-db-service
  selector:
    matchLabels:
      app: postgresql-db
  replicas: 1
  template:
    metadata:
      labels:
        app: postgresql-db
    spec:
      containers:
        - name: postgresql-db
          image: postgres:15
          volumeMounts:
            - mountPath: /data
              name: cache-volume
          env:
            - name: POSTGRES_USER
              value: testuser
            - name: POSTGRES_PASSWORD
              value: testpassword
            - name: PGDATA
              value: /data/pgdata
            - name: POSTGRES_DB
              value: keycloak
      volumes:
        - name: cache-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
  namespace: kafka-auth
spec:
  selector:
    app: postgresql-db
  ports:
    - port: 5432
      targetPort: 5432
