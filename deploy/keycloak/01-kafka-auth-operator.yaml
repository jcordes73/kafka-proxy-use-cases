# deploy/keycloak/01-kafka-auth-operator.yaml — Step 1.1 (openshift-setup.md)
# Namespace + OperatorGroup + Subscription for the Red Hat build of Keycloak
# operator, applied as a single transaction (the OperatorGroup must exist when
# the Subscription is validated).
#
# NOTE: installPlanApproval is Manual so OLM does not auto-upgrade RHBK server
# versions (upgrades can require DB migration and have no downgrade path).
# Approve InstallPlans deliberately: `oc get installplan -n kafka-auth` then
# `oc patch installplan <name> -n kafka-auth --type merge -p '{"spec":{"approved":true}}'`.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka-auth
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: keycloak-operator-group
  namespace: kafka-auth
spec:
  # OwnNamespace install — the RHBK operator CSV does not support AllNamespaces
  targetNamespaces:
    - kafka-auth
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhbk-operator
  namespace: kafka-auth
spec:
  channel: stable-v26.4
  name: rhbk-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
