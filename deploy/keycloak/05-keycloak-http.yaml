# deploy/keycloak/05-keycloak-http.yaml — Step 1.3 (docs/02-keycloak.md)
# Internal-only HTTP exposure for Keycloak. The Keycloak CR sets
# http-enabled: true (deploy/keycloak/03-keycloak.yaml), so the pod serves
# plain http on 8080 in addition to TLS on 8443; the operator's keycloak-service
# only exposes 8443/9000. The OAuth chain (broker JWKS fetch, client token
# endpoints) uses THIS service over the in-cluster network:
#   http://keycloak-http.kafka-auth.svc.cluster.local:8080/realms/kafka
#
# The operator-created keycloak-network-policy allows ingress only on 8443/9000
# — this additive policy opens 8080 for the OAuth clients (NetworkPolicy rules
# are additive; the operator manages only its own policy).
#
# DEV ONLY: in-cluster plain http (unencrypted, unauthenticated network path).
# For production, use the TLS route and trust its CA in every OAuth client.
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-http
  namespace: kafka-auth
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# Allow the OAuth clients (brokers' JWKS fetch, client token endpoints) to
# reach Keycloak's plain-http port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-allow-http-oauth
  namespace: kafka-auth
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-cluster-1
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-cluster-2
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-proxy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-http-bridge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-producer
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-consumer
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-console
      ports:
        - port: 8080
          protocol: TCP
