# deploy/demos/11-record-encryption.yaml — Demo 11 (docs/11-demos.md)
# Record Encryption at rest: envelope encryption at the proxy with a
# dev-mode HashiCorp Vault as the KMS (Transit engine).
#
#   - Vault (dev mode): single pod, HTTP, fixed root token `root` — DEV ONLY.
#     Records are encrypted with DEKs generated by Vault's Transit engine;
#     KEKs (KEK-*) never leave Vault.
#   - kek-setup Job: waits for Vault, enables the Transit engine, and creates
#     KEK-test-topic (the KEK for the demo topic — TemplateKekSelector maps
#     topic name → KEK-$(topicName)). Topics without a KEK pass through
#     unencrypted (PASSTHROUGH_UNENCRYPTED) — a demo point in itself.
#   - RecordEncryption filter: wired to the kafka-cluster-1 virtual cluster.
#     The Vault token is referenced via ${secret:encryption-filter:vault-token}
#     — DEV ONLY (the root token); production uses a least-privilege periodic
#     token in a Secret (Red Hat 3.2 Record Encryption guide, §2.1).
#
# Apply this file: it REPLACES the kafka-cluster-1 VirtualKafkaCluster from
# deploy/proxy/05-virtualkafkacluster.yaml. Revert the proxy wiring with:
#   oc apply -f deploy/proxy/05-virtualkafkacluster.yaml
# Tear down Vault with:
#   oc delete namespace kafka-vault
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka-vault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: kafka-vault
  labels:
    app: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
        - name: vault
          image: hashicorp/vault:1.20
          # dev mode: in-memory storage, unsealed, fixed root token — DEV ONLY
          args:
            - server
            - -dev
            - -dev-root-token-id=root
            - -dev-listen-address=0.0.0.0:8200
          ports:
            - containerPort: 8200
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["IPC_LOCK"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: kafka-vault
spec:
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kek-setup
  namespace: kafka-vault
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kek-setup
    spec:
      restartPolicy: Never
      containers:
        - name: vault-setup
          image: hashicorp/vault:1.20
          env:
            - name: VAULT_ADDR
              value: http://vault:8200
            - name: VAULT_TOKEN
              value: root
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until vault status >/dev/null 2>&1; do
                echo "waiting for vault..."; sleep 2
              done
              vault secrets enable transit 2>/dev/null || echo "transit already enabled"
              # KEKs for the demo topics — TemplateKekSelector maps
              # topic name → KEK-$(topicName)
              vault write transit/keys/KEK-test-topic
              vault write transit/keys/KEK-admin-topic
              echo "KEKs created:"
              vault list transit/keys
---
apiVersion: v1
kind: Secret
metadata:
  name: encryption-filter
  namespace: kafka-proxy
  labels:
    app: kroxylicious
type: Opaque
stringData:
  # DEV ONLY: the Vault dev-mode root token. Production: a least-privilege
  # periodic Vault token (Red Hat 3.2 Record Encryption guide, §2.1).
  vault-token: root
---
apiVersion: kroxylicious.io/v1alpha1
kind: KafkaProtocolFilter
metadata:
  name: record-encryption
  namespace: kafka-proxy
spec:
  type: RecordEncryption
  configTemplate:
    kms: VaultKmsService
    kmsConfig:
      vaultUrl: http://vault.kafka-vault.svc.cluster.local:8200
      credentials:
        vaultToken:
          token:
            # operator interpolation mounts the Secret as a file
            passwordFile: ${secret:encryption-filter:vault-token}
    selector: TemplateKekSelector
    selectorConfig:
      template: "KEK-$(topicName)"
    # topics without a KEK pass through unencrypted — switch to REJECT to
    # reject whole produce requests instead (safer: no unencrypted data
    # is ever forwarded)
    unresolvedKeyPolicy: PASSTHROUGH_UNENCRYPTED
---
apiVersion: kroxylicious.io/v1alpha1
kind: VirtualKafkaCluster
metadata:
  name: kafka-cluster-1
  namespace: kafka-proxy
spec:
  proxyRef:
    name: simple
  targetKafkaServiceRef:
    name: kafka-cluster-1
  ingresses:
    - ingressRef:
        name: cluster-ip-1
      tls:
        certificateRef:
          name: proxy-tls
          kind: Secret
  filterRefs:
    - name: record-encryption
