---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: strimzi-kafka-connect
  namespace: kafka
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: perses-observability-operator
  config:
    display:
      name: Strimzi Kafka Connect
      description: Converted from the Strimzi Grafana dashboard (strimzi-kafka-connect) to Perses. Metrics use Kafka 4.x naming, verified against the live cluster; queries target the user-workload-monitoring
        datasource (Thanos Querier).
    duration: '6h'
    refreshInterval: '1m'
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowMultiple: false
        allowAllValue: false
        display:
          name: Namespace
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: namespace
            matchers:
            - kafka_connect_worker_connector_count
    - kind: ListVariable
      spec:
        name: strimzi_connect_cluster_name
        allowMultiple: false
        allowAllValue: false
        display:
          name: Cluster Name
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: strimzi_io_cluster
            matchers:
            - kafka_connect_worker_connector_count
    layouts:
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
        - x: 0
          y: 1
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_0'
        - x: 6
          y: 1
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_1'
        - x: 12
          y: 1
          width: 12
          height: 7
          content:
            $ref: '#/spec/panels/0_2'
        - x: 0
          y: 8
          width: 12
          height: 7
          content:
            $ref: '#/spec/panels/0_3'
        - x: 12
          y: 8
          width: 12
          height: 7
          content:
            $ref: '#/spec/panels/0_4'
    - kind: Grid
      spec:
        display:
          title: Workers
          collapse:
            open: true
        items:
        - x: 0
          y: 16
          width: 12
          height: 4
          content:
            $ref: '#/spec/panels/1_0'
        - x: 12
          y: 16
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_1'
        - x: 0
          y: 20
          width: 12
          height: 4
          content:
            $ref: '#/spec/panels/1_2'
    - kind: Grid
      spec:
        display:
          title: Connectors and Tasks
          collapse:
            open: true
        items:
        - x: 0
          y: 25
          width: 12
          height: 9
          content:
            $ref: '#/spec/panels/2_0'
        - x: 12
          y: 25
          width: 12
          height: 9
          content:
            $ref: '#/spec/panels/2_1'
        - x: 0
          y: 34
          width: 24
          height: 7
          content:
            $ref: '#/spec/panels/2_2'
        - x: 0
          y: 41
          width: 24
          height: 8
          content:
            $ref: '#/spec/panels/2_3'
    - kind: Grid
      spec:
        display:
          title: JVM
          collapse:
            open: true
        items:
        - x: 0
          y: 50
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/3_0'
        - x: 6
          y: 50
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/3_1'
        - x: 12
          y: 50
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/3_2'
        - x: 18
          y: 50
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/3_3'
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            name: Number of Connectors
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
      '0_1':
        kind: Panel
        spec:
          display:
            name: Number of Tasks
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_task_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
      '0_2':
        kind: Panel
        spec:
          display:
            name: Connection Count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
                values:
                - last-number
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_consumer_connection_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_producer_connection_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_admin_client_connection_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
      '0_3':
        kind: Panel
        spec:
          display:
            name: (Source/Producers) Outgoing Bytes per Second
            description: Bytes per second outgoing to Kafka from Connect worker. Includes data to internal topics.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - last-number
              visual:
                areaOpacity: 1
                connectNulls: false
                display: line
                lineWidth: 1
                stack: all
              yAxis:
                format:
                  unit: bytes/sec
                label: Bytes/sec
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(kafka_producer_outgoing_byte_total{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}[5m])) by (pod)
      '0_4':
        kind: Panel
        spec:
          display:
            name: (Sink/Consumers) Incoming Bytes per Second
            description: Bytes per second incoming to Kafka Connect worker from Kafka. Includes data from internal topics.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - last-number
              visual:
                areaOpacity: 1
                connectNulls: false
                display: line
                lineWidth: 1
                stack: all
              yAxis:
                format:
                  unit: bytes/sec
                label: Bytes/sec
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(kafka_consumer_incoming_byte_total{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}[5m])) by (pod)
      '1_0':
        kind: Panel
        spec:
          display:
            name: Assigned Connectors by Worker
          plugin:
            kind: BarChart
            spec:
              calculation: last
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_coordinator_assigned_connectors{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}) by (pod)
      '1_1':
        kind: Panel
        spec:
          display:
            name: Rebalancing
          plugin:
            kind: TimeSeriesChart
            spec:
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: decimal
                max: 1
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_rebalance_rebalancing{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
      '1_2':
        kind: Panel
        spec:
          display:
            name: Assigned Tasks per Worker
          plugin:
            kind: BarChart
            spec:
              calculation: last
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_coordinator_assigned_tasks{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}) by (pod)
      '2_0':
        kind: Panel
        spec:
          display:
            name: Connector Tasks with Issues
            description: Connectors that have one or more tasks that are not in a running state, i.e. the state is one of paused, failed, unassigned or destroyed.
          plugin:
            kind: Table
            spec:
              columnSettings:
              - header: Connector
                name: connector
              - header: Paused Tasks
                name: 'Value #A'
              - header: Failed Tasks
                name: 'Value #B'
              - header: Unassigned Tasks
                name: 'Value #C'
              - header: Destroyed Tasks
                name: 'Value #D'
              - header: Update Time
                name: timestamp
              density: compact
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_paused_task_count{namespace=~"$namespace",strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}) by (connector)
                    != 0
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_failed_task_count{namespace=~"$namespace",strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}) by (connector)
                    != 0
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_unassigned_task_count{namespace=~"$namespace",strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}) by (connector)
                    != 0
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_destroyed_task_count{namespace=~"$namespace",strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}) by (connector)
                    != 0
      '2_1':
        kind: Panel
        spec:
          display:
            name: Connector Task State
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: right
                values:
                - last-number
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: decimal
                label: Number of connector tasks
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_running_task_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_paused_task_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_failed_task_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_unassigned_task_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_destroyed_task_count{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"})
      '2_2':
        kind: Panel
        spec:
          display:
            name: Connector Status
          plugin:
            kind: Table
            spec:
              columnSettings:
              - header: Connector
                name: connector
              - header: Worker Pod Name
                name: kubernetes_pod_name
              - header: Class
                name: connector_class
              - header: Type
                name: connector_type
              - header: Version
                name: connector_version
              - header: Status
                name: status
              - header: Update Time
                name: timestamp
              density: compact
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_connector_status{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"} * on(connector) group_left(connector_class) kafka_connect_connector_connector_class{}
                    * on (connector) group_left(connector_version) kafka_connect_connector_connector_version{} * on (connector) group_left(connector_type) kafka_connect_connector_connector_type{}) by (connector,
                    status, connector_class, pod, connector_version, connector_type)
      '2_3':
        kind: Panel
        spec:
          display:
            name: Connector Task Status
          plugin:
            kind: Table
            spec:
              columnSettings:
              - header: Connector
                hide: false
                name: connector
              - header: Task
                name: task
              - header: Worker Pod Name
                name: kubernetes_pod_name
              - header: Total Record Failures
                name: value
              - header: Status
                name: status
              - header: Update Time
                name: timestamp
              density: compact
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_task_error_total_record_failures{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"} * on(connector, task) group_left(status)
                    kafka_connect_connector_task_status{}) by (connector, status, pod, task)
      '3_0':
        kind: Panel
        spec:
          display:
            name: CPU Usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last-number
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: Cores
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(container_cpu_usage_seconds_total{namespace=~"$namespace",pod=~"$strimzi_connect_cluster_name-connect-.+",container="$strimzi_connect_cluster_name-connect"}[5m])) by (pod)
      '3_1':
        kind: Panel
        spec:
          display:
            name: JVM Memory
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last-number
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
                label: Memory
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum (jvm_memory_used_bytes{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}) by (pod)
      '3_2':
        kind: Panel
        spec:
          display:
            name: Time Spent in GC
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last-number
                - max
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent
                label: '% time in GC'
                max: 100
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(jvm_gc_collection_seconds_sum{strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}[5m])) by (pod)
      '3_3':
        kind: Panel
        spec:
          display:
            name: JVM Thread Count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last-number
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(jvm_threads_current{namespace=~"$namespace",strimzi_io_kind=~"KafkaConnect.*",strimzi_io_cluster=~"$strimzi_connect_cluster_name"}) by (pod)
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: strimzi-kafka-exporter
  namespace: kafka
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: perses-observability-operator
  config:
    display:
      name: Strimzi Kafka Exporter
      description: Converted from the Strimzi Grafana dashboard (strimzi-kafka-exporter) to Perses. Metrics use Kafka 4.x naming, verified against the live cluster; queries target the user-workload-monitoring
        datasource (Thanos Querier).
    duration: '6h'
    refreshInterval: '1m'
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowMultiple: false
        allowAllValue: false
        display:
          name: Namespace
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: namespace
            matchers:
            - kafka_broker_info
    - kind: ListVariable
      spec:
        name: strimzi_cluster_name
        allowMultiple: false
        allowAllValue: false
        display:
          name: Cluster Name
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: strimzi_io_cluster
            matchers:
            - kafka_broker_info
    - kind: ListVariable
      spec:
        name: consumergroup
        allowMultiple: true
        allowAllValue: true
        display:
          name: Consumer Group
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: consumergroup
            matchers:
            - kafka_consumergroup_current_offset
        customAllValue: .*
    - kind: ListVariable
      spec:
        name: topic
        allowMultiple: true
        allowAllValue: true
        display:
          name: Topic
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: topic
            matchers:
            - kafka_topic_partition_current_offset
        customAllValue: .*
    layouts:
    - kind: Grid
      spec:
        display:
          title: Panel Group 1
        items:
        - x: 0
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/0'
        - x: 3
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/1'
        - x: 6
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/2'
        - x: 9
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/3'
        - x: 12
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/4'
        - x: 15
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/5'
        - x: 18
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/6'
        - x: 21
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/7'
        - x: 0
          y: 4
          width: 8
          height: 10
          content:
            $ref: '#/spec/panels/8'
        - x: 8
          y: 4
          width: 8
          height: 10
          content:
            $ref: '#/spec/panels/9'
        - x: 16
          y: 4
          width: 8
          height: 10
          content:
            $ref: '#/spec/panels/10'
        - x: 0
          y: 14
          width: 12
          height: 10
          content:
            $ref: '#/spec/panels/11'
        - x: 12
          y: 14
          width: 12
          height: 10
          content:
            $ref: '#/spec/panels/12'
        - x: 0
          y: 24
          width: 8
          height: 10
          content:
            $ref: '#/spec/panels/13'
        - x: 8
          y: 24
          width: 8
          height: 10
          content:
            $ref: '#/spec/panels/14'
        - x: 16
          y: 24
          width: 8
          height: 10
          content:
            $ref: '#/spec/panels/15'
    panels:
      '0':
        kind: Panel
        spec:
          display:
            name: Topics
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: count(kafka_topic_partitions{topic=~"$topic", namespace=~"$namespace"})
      '1':
        kind: Panel
        spec:
          display:
            name: Partitions
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_topic_partitions{topic=~"$topic", namespace=~"$namespace"})
      '2':
        kind: Panel
        spec:
          display:
            name: Replicas
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_topic_partition_replicas{topic=~"$topic", namespace=~"$namespace"})
      '3':
        kind: Panel
        spec:
          display:
            name: In Sync Replicas
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_topic_partition_in_sync_replica{topic=~"$topic", namespace=~"$namespace"})
      '4':
        kind: Panel
        spec:
          display:
            name: Under Replicated Partitions
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: rgb(255, 255, 255)
                  value: 0
                - color: '#F2495C'
                  value: 1
                - color: '#d44a3a'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_topic_partition_under_replicated_partition{topic=~"$topic", namespace=~"$namespace"})
      '5':
        kind: Panel
        spec:
          display:
            name: Partitions at minimum ISR
            description: Number of partitions which are at their minimum in sync replica count (| ISR | == | min.insync.replicas |)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: rgb(255, 255, 255)
                  value: 0
                - color: '#F2495C'
                  value: 1
                - color: '#d44a3a'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_cluster_partition_atminisr{topic=~"$topic", namespace=~"$namespace"})
      '6':
        kind: Panel
        spec:
          display:
            name: Partitions under minimum ISR
            description: Number of partitions which are under their minimum in sync replica count (| ISR | < | min.insync.replicas |)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: rgb(255, 255, 255)
                  value: 0
                - color: '#F2495C'
                  value: 1
                - color: '#d44a3a'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_cluster_partition_underminisr{topic=~"$topic", namespace=~"$namespace"})
      '7':
        kind: Panel
        spec:
          display:
            name: Partitions not on preferred node
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#299c46'
                  value: 0
                - color: '#F2495C'
                  value: 1
                - color: '#d44a3a'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_topic_partition_leader_is_preferred{topic=~"$topic", namespace=~"$namespace"} < bool 1)
      '8':
        kind: Panel
        spec:
          display:
            name: Messages in per second
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last-number
                - max
              visual:
                areaOpacity: 0
                connectNulls: true
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(kafka_topic_partition_current_offset{topic=~"$topic", namespace=~"$namespace"}[5m])) by (topic)
      '9':
        kind: Panel
        spec:
          display:
            name: Messages consumed per second
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last-number
                - max
              visual:
                areaOpacity: 0
                connectNulls: true
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(delta(kafka_consumergroup_current_offset{consumergroup=~"$consumergroup",topic=~"$topic", namespace=~"$namespace"}[5m])/300) by (consumergroup, topic)
      '10':
        kind: Panel
        spec:
          display:
            name: Lag by  Consumer Group
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last-number
                - max
              visual:
                areaOpacity: 0
                connectNulls: true
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: 'sum(kafka_consumergroup_lag{consumergroup=~"$consumergroup",topic=~"$topic", namespace=~"$namespace"}) by (consumergroup, topic) '
      '11':
        kind: Panel
        spec:
          display:
            name: Consumer Group Offsets
          plugin:
            kind: Table
            spec:
              columnSettings: []
              density: compact
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_consumergroup_current_offset{consumergroup=~"$consumergroup",topic=~"$topic", namespace=~"$namespace"}) by (consumergroup,partition,topic)
      '12':
        kind: Panel
        spec:
          display:
            name: Consumer Group Lag
          plugin:
            kind: Table
            spec:
              columnSettings: []
              density: compact
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_consumergroup_lag{consumergroup=~"$consumergroup",topic=~"$topic", namespace=~"$namespace"}) by (consumergroup,partition,topic)
      '13':
        kind: Panel
        spec:
          display:
            name: Number of Partitions
          plugin:
            kind: Table
            spec:
              columnSettings: []
              density: compact
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_topic_partitions{topic=~"$topic", namespace=~"$namespace"}) by (topic)
      '14':
        kind: Panel
        spec:
          display:
            name: Latest Offsets
          plugin:
            kind: Table
            spec:
              columnSettings: []
              density: compact
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_topic_partition_current_offset{topic=~"$topic", namespace=~"$namespace"}) by (partition,topic)
      '15':
        kind: Panel
        spec:
          display:
            name: Oldest Offsets
          plugin:
            kind: Table
            spec:
              columnSettings: []
              density: compact
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_topic_partition_oldest_offset{topic=~"$topic", namespace=~"$namespace"}) by (partition,topic)
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: strimzi-kafka-mirror-maker-2
  namespace: kafka
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: perses-observability-operator
  config:
    display:
      name: Strimzi Kafka Mirror Maker 2
      description: Converted from the Strimzi Grafana dashboard (strimzi-kafka-mirror-maker-2) to Perses. Metrics use Kafka 4.x naming, verified against the live cluster; queries target the user-workload-monitoring
        datasource (Thanos Querier).
    duration: '6h'
    refreshInterval: '1m'
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowMultiple: false
        allowAllValue: false
        display:
          name: Namespace
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: namespace
            matchers:
            - kafka_connect_worker_connector_count
    - kind: ListVariable
      spec:
        name: strimzi_mirror_maker_cluster_name
        allowMultiple: false
        allowAllValue: false
        display:
          name: Cluster Name
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: strimzi_io_cluster
            matchers:
            - kafka_connect_worker_connector_count
    layouts:
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
        - x: 0
          y: 1
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/0_0'
        - x: 4
          y: 1
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/0_1'
        - x: 8
          y: 1
          width: 16
          height: 8
          content:
            $ref: '#/spec/panels/0_2'
        - x: 0
          y: 5
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/0_3'
        - x: 4
          y: 5
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/0_4'
        - x: 0
          y: 9
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_5'
        - x: 12
          y: 9
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_6'
        - x: 0
          y: 17
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_7'
        - x: 12
          y: 17
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_8'
        - x: 0
          y: 25
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_9'
        - x: 12
          y: 25
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_10'
        - x: 0
          y: 33
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/0_11'
        - x: 8
          y: 33
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/0_12'
        - x: 16
          y: 33
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/0_13'
    - kind: Grid
      spec:
        display:
          title: Workers
          collapse:
            open: true
        items:
        - x: 0
          y: 42
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/1_0'
        - x: 12
          y: 42
          width: 12
          height: 6
          content:
            $ref: '#/spec/panels/1_1'
        - x: 0
          y: 45
          width: 12
          height: 3
          content:
            $ref: '#/spec/panels/1_2'
    - kind: Grid
      spec:
        display:
          title: JVM
          collapse:
            open: true
        items:
        - x: 0
          y: 49
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/2_0'
        - x: 6
          y: 49
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/2_1'
        - x: 12
          y: 49
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/2_2'
        - x: 18
          y: 49
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/2_3'
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            name: Total Number of Running Connectors
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_connector_count{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"})
      '0_1':
        kind: Panel
        spec:
          display:
            name: Total record rate
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_record_rate{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"})
      '0_2':
        kind: Panel
        spec:
          display:
            name: Record Age
            description: Time duration between record timestamp in the source topic and the time when the source connector handles the record (aka. MM2 consumer lag time).
          plugin:
            kind: Table
            spec:
              columnSettings:
              - name: timestamp
                width: 188
              - header: Topic
                name: topic
                width: 579
              - header: Partition
                name: partition
                width: 140
              - header: Lag
                name: value
              - header: Current
                name: 'Value #A'
                width: 126
              - header: Average
                name: 'Value #Avg'
                width: 118
              - header: Min
                name: 'Value #C'
                width: 109
              - header: Max
                name: 'Value #D'
                width: 107
              - header: Average
                name: 'Value #B'
              - header: Min
                name: '{partition="2", topic="my-cluster-source.kafka-test-apps"}'
              density: compact
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_record_age_ms{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}) by (partition, topic)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_record_age_ms_avg{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}) by (partition, topic)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_record_age_ms_min{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}) by (partition, topic)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_record_age_ms_max{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}) by (partition, topic)
      '0_3':
        kind: Panel
        spec:
          display:
            name: Total Number of Running Tasks
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_worker_task_count{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"})
      '0_4':
        kind: Panel
        spec:
          display:
            name: Total byte rate
          plugin:
            kind: StatChart
            spec:
              calculation: mean
              colorMode: none
              format:
                unit: bytes/sec
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_byte_rate{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"})
      '0_5':
        kind: Panel
        spec:
          display:
            name: Consumer Lag
            description: Consumer lag which in the context of the replication indicates whether the consumer in the source connector can keep up with the rate records are produced in the source.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: offset
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_consumer_fetch_manager_records_lag{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name",clientid=~".*replication-consumer\""})
                    by (topic, partition)
      '0_6':
        kind: Panel
        spec:
          display:
            name: Consumer Lag
            description: Consumer lag which in the context of the replication indicates whether the consumer in the source connector can keep up with the rate records are produced in the source.
          plugin:
            kind: Table
            spec:
              columnSettings:
              - name: timestamp
              - header: Topic
                name: topic
              - header: Partition
                name: partition
              - header: Lag
                name: value
              density: compact
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: topk(20, sum(kafka_consumer_fetch_manager_records_lag{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name",clientid=~".*replication-consumer\""})
                    by (partition, topic))
      '0_7':
        kind: Panel
        spec:
          display:
            name: Incoming Bytes per Second
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - last-number
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decbytes/sec
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(kafka_consumer_incoming_byte_total{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}[5m])) by (pod)
      '0_8':
        kind: Panel
        spec:
          display:
            name: Outgoing Bytes per Second
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - mean
                - last-number
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decbytes/sec
                min: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(kafka_producer_outgoing_byte_total{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}[5m])) by (pod)
      '0_9':
        kind: Panel
        spec:
          display:
            name: Replication Latency
            description: The end to end latency from the record timestamp in the source topic to the time when the record is written successfully to the target cluster.
          plugin:
            kind: Table
            spec:
              columnSettings:
              - name: timestamp
                width: 155
              - header: Topic
                name: topic
                width: 552
              - header: Partition
                name: partition
                width: 76
              - header: Lag
                name: value
              - header: Current
                name: 'Value #A'
                width: 65
              - header: Average
                name: 'Value #Avg'
                width: 70
              - header: Min
                name: 'Value #C'
                width: 45
              - header: Max
                name: 'Value #D'
                width: 41
              - header: Average
                name: 'Value #B'
              - header: Min
                name: '{partition="2", topic="my-cluster-source.kafka-test-apps"}'
              density: compact
              transforms:
              - kind: MergeSeries
                spec: {}
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_replication_latency_ms{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}) by (partition,
                    topic)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_replication_latency_ms_avg{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}) by (partition,
                    topic)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_replication_latency_ms_min{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}) by (partition,
                    topic)
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_connect_mirror_mirrorsourceconnector_replication_latency_ms_max{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"}) by (partition,
                    topic)
      '0_10':
        kind: Panel
        spec:
          display:
            name: Consumer Group Offset Sync Latency
            description: The latency for synchronizing the consumer groups of the source cluster to the target cluster.
          plugin:
            kind: Table
            spec:
              columnSettings:
              - hide: true
                name: timestamp
              - header: Topic
                name: topic
              - header: Group
                name: group
              - header: Partition
                name: partition
                width: 71
              - header: Source
                name: source
              - header: Target
                name: target
              - header: Latency
                name: value
                width: 127
              - hide: true
                name: __name__
              - hide: true
                name: container
              - hide: true
                name: endpoint
              - header: ''
                hide: true
                name: instance
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum by (source, target, topic, partition, group) (kafka_connect_mirror_mirrorcheckpointconnector_checkpoint_latency_ms{strimzi_io_kind=~"KafkaMirrorMaker2",strimzi_io_cluster=~"$strimzi_mirror_maker_cluster_name"})
      '0_11':
        kind: Panel
        spec:
          display:
            name: Source Connector - Producer Available Buffer
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last-number
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_producer_buffer_available_bytes{clientid=~"\".*SourceConnector-[0-9]+\""})
      '0_12':
        kind: Panel
        spec:
          display:
            name: Source Connector - Average Offset Commit Time
            description: Time duration that this task takes to commit its offsets to the target.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: table
                position: bottom
                values:
                - last-number
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: milliseconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
