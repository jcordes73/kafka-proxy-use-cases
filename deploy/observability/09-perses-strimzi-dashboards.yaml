                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(strimzi_reconciliations_duration_seconds_max) by (kind)
      '2_0':
        kind: Panel
        spec:
          display:
            name: Cert Expiry
          plugin:
            kind: Table
            spec:
              columnSettings:
              - hide: true
                name: timestamp
              - header: Cluster Name
                name: cluster
              - header: Namespace
                name: resource_namespace
              - header: Type
                name: type
              - header: Expiry Time
                name: value
              - header: Time To Expiry
