                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(increase(strimzi_reconciliations_locked_total[1h])) by (kind)
      '1_3':
        kind: Panel
        spec:
          display:
            name: Started Reconciliation per hour
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(increase(strimzi_reconciliations_total[1h])) by (kind)
      '1_4':
        kind: Panel
        spec:
          display:
            name: Periodical Reconciliation per hour
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(increase(strimzi_reconciliations_periodical_total[1h])) by (kind)
      '1_5':
        kind: Panel
        spec:
          display:
            name: Maximum reconciliation time
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
