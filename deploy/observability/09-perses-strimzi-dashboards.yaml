apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: strimzi-kafka-oauth
  namespace: kafka
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: perses-observability-operator
  config:
    display:
      name: Strimzi Kafka OAuth
      description: Converted from the Strimzi Grafana dashboard (strimzi-kafka-oauth) to Perses. Metrics use Kafka 4.x naming, verified against the live cluster; queries target the user-workload-monitoring
        datasource (Thanos Querier).
    duration: '6h'
    refreshInterval: '1m'
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowMultiple: false
        allowAllValue: false
        display:
          name: Namespace
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: namespace
            matchers:
            - kafka_server_replicamanager_leadercount
    - kind: ListVariable
      spec:
        name: strimzi_cluster_name
        allowMultiple: false
        allowAllValue: false
        display:
          name: Cluster Name
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: strimzi_io_cluster
            matchers:
            - kafka_server_replicamanager_leadercount
    - kind: ListVariable
      spec:
        name: kafka_broker
        allowMultiple: false
        allowAllValue: true
        display:
          name: Broker
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: pod
            matchers:
            - kafka_server_replicamanager_leadercount
        customAllValue: .*
    layouts:
    - kind: Grid
      spec:
        display:
          title: OAuth
          collapse:
            open: true
        items:
        - x: 0
          y: 1
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_0'
        - x: 12
          y: 1
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_1'
        - x: 0
          y: 9
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_2'
        - x: 12
          y: 9
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_3'
        - x: 0
          y: 17
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_4'
        - x: 12
          y: 17
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_5'
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            name: OAuth HTTP Request Count
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 1
                connectNulls: false
                display: bar
                lineWidth: 1
                stack: all
              yAxis:
                format:
                  decimalPlaces: 0
                  unit: decimal
