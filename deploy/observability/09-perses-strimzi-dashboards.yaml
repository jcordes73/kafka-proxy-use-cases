    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            name: HTTP connections
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(strimzi_bridge_http_server_active_connections{container=~"^.+-bridge"})
      '0_1':
        kind: Panel
        spec:
          display:
            name: HTTP requests being processed
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: none
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(strimzi_bridge_http_server_active_requests{container=~"^.+-bridge"})
      '1_0':
        kind: Panel
        spec:
          display:
            name: Producer rate
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: records/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(strimzi_bridge_kafka_producer_record_send_total{topic != ""}[5m])) by (clientId, topic)
      '1_1':
        kind: Panel
        spec:
          display:
            name: Producer rate
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: bytes/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(strimzi_bridge_kafka_producer_byte_total{topic != ""}[5m])) by (clientId, topic)
      '1_2':
        kind: Panel
        spec:
          display:
            name: Average producer request latency
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: ms
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(strimzi_bridge_kafka_producer_request_latency_avg{type = "producer-metrics"}) by (clientId)
      '1_3':
        kind: Panel
