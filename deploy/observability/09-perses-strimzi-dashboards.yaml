---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: strimzi-kraft
  namespace: kafka
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: perses-observability-operator
  config:
    display:
      name: Strimzi KRaft
      description: Converted from the Strimzi Grafana dashboard (strimzi-kraft) to Perses. Metrics use Kafka 4.x naming, verified against the live cluster; queries target the user-workload-monitoring datasource
        (Thanos Querier).
    duration: '6h'
    refreshInterval: '1m'
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowMultiple: false
        allowAllValue: false
        display:
          name: Namespace
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: namespace
            matchers:
            - kafka_server_raftmetrics_current_leader
    - kind: ListVariable
      spec:
        name: strimzi_cluster_name
        allowMultiple: false
        allowAllValue: false
        display:
          name: Cluster Name
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: strimzi_io_cluster
            matchers:
            - kafka_server_raftmetrics_current_leader
    - kind: ListVariable
      spec:
        name: kraft_node
        allowMultiple: false
        allowAllValue: true
        display:
          name: Broker
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: pod
            matchers:
            - kafka_server_raftmetrics_current_leader
        customAllValue: .*
    layouts:
    - kind: Grid
      spec:
        display:
          title: KRaft
          collapse:
            open: true
        items:
        - x: 0
          y: 1
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_0'
        - x: 6
          y: 1
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_1'
        - x: 12
          y: 1
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_2'
        - x: 18
          y: 1
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_3'
        - x: 0
          y: 8
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_4'
        - x: 6
          y: 8
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_5'
        - x: 12
          y: 8
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_6'
        - x: 18
          y: 8
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/0_7'
        - x: 0
          y: 15
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/0_8'
        - x: 8
          y: 15
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/0_9'
        - x: 16
          y: 15
          width: 8
          height: 8
          content:
            $ref: '#/spec/panels/0_10'
        - x: 0
          y: 23
          width: 6
          height: 8
          content:
            $ref: '#/spec/panels/0_11'
        - x: 6
          y: 23
          width: 6
          height: 8
          content:
            $ref: '#/spec/panels/0_12'
        - x: 12
          y: 23
          width: 6
          height: 8
          content:
            $ref: '#/spec/panels/0_13'
        - x: 18
          y: 23
          width: 6
          height: 8
          content:
            $ref: '#/spec/panels/0_14'
        - x: 0
          y: 31
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_15'
        - x: 12
          y: 31
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_16'
        - x: 0
          y: 39
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_17'
        - x: 12
          y: 39
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_18'
        - x: 0
          y: 47
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_19'
        - x: 12
          y: 47
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/0_20'
    panels:
      '0_0':
        kind: Panel
        spec:
          display:
            name: Memory Usage
            description: Kafka broker pods memory usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(container_memory_usage_bytes{namespace=~"$namespace",pod=~".*$kraft_node",container="kafka"}) by (pod)
      '0_1':
        kind: Panel
        spec:
          display:
            name: CPU Usage
            description: Aggregated Kafka broker pods CPU usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(container_cpu_usage_seconds_total{namespace=~"$namespace",pod=~".*$kraft_node",container="kafka"}[5m])) by (pod)
      '0_2':
        kind: Panel
        spec:
