# deploy/observability/09-perses-strimzi-dashboards.yaml — the Strimzi Grafana
# dashboards (github.com/strimzi/strimzi-kafka-operator
# examples/metrics/grafana-dashboards) translated to Perses
# (perses.dev/v1alpha2 PersesDashboard CRs).
#
# Nine dashboards, same names as upstream (strimzi-*), all in `kafka` (the
# kafka Perses project):
#   strimzi-kafka              broker detail (Kafka 4.x metric naming)
#   strimzi-kraft              KRaft / raft quorum
#   strimzi-kafka-bridge       HTTP bridge (Vert.x metrics; the upstream
#                              kafka producer/consumer panels are dropped —
#                              the bridge does not expose those counters)
#   strimzi-kafka-connect      KafkaConnect workers/connectors
#   strimzi-kafka-exporter     kafka-exporter topic/consumer-group lag
#   strimzi-kafka-mirror-maker-2  MM2 replication
#   strimzi-kafka-oauth        OAuth authentication metrics
#   strimzi-operators          Strimzi operator reconciliations
#   strimzi-cruise-control     Cruise Control
#
# Conversion (percli online migrate for the panel chrome + queries injected
# from the Grafana JSON, then normalised):
#   - Kafka 4.x metric renames applied (verified against the live Thanos
#     catalog: e.g. kafka_server_brokertopicmetrics_bytesinpersec_total,
#     kafka_server_raft_metrics_*, kafka_cluster_partition_underreplicated)
#   - labels normalised to what this cluster sets: namespace, strimzi_io_cluster,
#     pod (the Grafana kubernetes_namespace / strimzi_cluster_name /
#     kubernetes_pod_name labels do not exist here)
#   - datasource fixed to `user-workload-monitoring` (see 07-*.yaml)
#   - Grafana's __rate_interval replaced with a fixed 5m window
#   - panel/map keys quoted ('0_8' — unquoted plain 0_8 is parsed as the
#     number 8 by the YAML parser and breaks the panel $refs)
#   - rgba() colors converted to hex (perses CUE schemas only accept hex)
#   - connect/exporter/mm2/oauth/operators/cruise-control panels keep their
#     upstream metric names — they return data once those components are
#     deployed with monitoring (they are not scraped on the tested cluster)
#
# Apply 07 FIRST (datasource + RBAC), then this file:
#   oc apply -f deploy/observability/07-perses-dashboards.yaml
#   oc apply -f deploy/observability/09-perses-strimzi-dashboards.yaml
#   oc wait --for=condition=Reconciled -n kafka persesdashboards --all --timeout=180s
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: strimzi-kafka
  namespace: kafka
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: perses-observability-operator
  config:
    display:
      name: Strimzi Kafka
      description: Converted from the Strimzi Grafana dashboard (strimzi-kafka) to Perses. Metrics use Kafka 4.x naming, verified against the live cluster; queries target the user-workload-monitoring datasource
        (Thanos Querier).
    duration: '6h'
    refreshInterval: '1m'
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowMultiple: false
        allowAllValue: false
        display:
          name: Namespace
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: namespace
            matchers:
            - kafka_server_replicamanager_leadercount
    - kind: ListVariable
      spec:
        name: strimzi_cluster_name
        allowMultiple: false
        allowAllValue: false
        display:
          name: Cluster Name
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: strimzi_io_cluster
            matchers:
            - kafka_server_replicamanager_leadercount
    - kind: ListVariable
      spec:
        name: kafka_broker
        allowMultiple: false
        allowAllValue: true
        display:
          name: Broker
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: pod
            matchers:
            - kafka_server_replicamanager_leadercount
        customAllValue: .*
    - kind: ListVariable
      spec:
        name: kafka_topic
        allowMultiple: false
        allowAllValue: true
        display:
          name: Topic
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: topic
            matchers:
            - kafka_cluster_partition_replicascount
        customAllValue: .+
    - kind: ListVariable
      spec:
        name: kafka_partition
        allowMultiple: true
        allowAllValue: true
        display:
          name: Partition
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: partition
            matchers:
            - kafka_log_log_size
        customAllValue: .*
    layouts:
    - kind: Grid
      spec:
        display:
          title: Panel Group 1
        items:
        - x: 0
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/0'
        - x: 3
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/1'
        - x: 6
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/2'
        - x: 9
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/3'
        - x: 12
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/4'
        - x: 15
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/5'
        - x: 18
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/6'
        - x: 21
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/7'
        - x: 0
          y: 4
          width: 6
          height: 4
          content:
            $ref: '#/spec/panels/8'
        - x: 6
          y: 4
          width: 6
          height: 4
          content:
            $ref: '#/spec/panels/9'
        - x: 12
          y: 4
          width: 6
          height: 4
          content:
            $ref: '#/spec/panels/10'
        - x: 18
          y: 4
          width: 6
          height: 4
          content:
            $ref: '#/spec/panels/11'
    - kind: Grid
      spec:
        display:
          title: Kafka
          collapse:
            open: true
        items:
        - x: 0
          y: 9
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/12_0'
        - x: 6
          y: 9
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/12_1'
        - x: 12
          y: 9
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/12_2'
        - x: 18
          y: 9
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/12_3'
        - x: 0
          y: 16
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/12_4'
        - x: 6
          y: 16
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/12_5'
        - x: 12
          y: 16
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/12_6'
        - x: 18
          y: 16
          width: 6
          height: 7
          content:
            $ref: '#/spec/panels/12_7'
        - x: 0
          y: 23
          width: 6
          height: 4
          content:
            $ref: '#/spec/panels/12_8'
        - x: 6
          y: 23
          width: 6
          height: 4
          content:
            $ref: '#/spec/panels/12_9'
        - x: 12
          y: 23
          width: 6
          height: 4
          content:
            $ref: '#/spec/panels/12_10'
        - x: 18
          y: 23
          width: 6
          height: 4
          content:
            $ref: '#/spec/panels/12_11'
        - x: 0
          y: 27
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_12'
        - x: 12
          y: 27
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_13'
        - x: 0
          y: 35
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_14'
        - x: 12
          y: 35
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_15'
        - x: 0
          y: 43
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_16'
        - x: 12
          y: 43
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_17'
        - x: 0
          y: 51
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_18'
        - x: 12
          y: 51
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_19'
        - x: 0
          y: 59
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_20'
        - x: 12
          y: 59
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/12_21'
    panels:
      '0':
        kind: Panel
        spec:
          display:
            name: Brokers Online
            description: Number of brokers online
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#d44a3a'
                  value: 0
                - color: '#ed8128'
                  value: 0
                - color: '#299c46'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: count(kafka_server_replicamanager_leadercount{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"})
      '1':
        kind: Panel
        spec:
          display:
            name: Active Controllers
            description: Number of active controllers in the cluster
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#299c46'
                  value: 0
                - color: '#e5ac0e'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_controller_kafkacontroller_activecontrollercount{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"})
      '2':
        kind: Panel
        spec:
          display:
            name: Unclean Leader Election Rate
            description: Unclean leader election rate
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#299c46'
                  value: 0
                - color: '#ed8128'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(irate(kafka_controller_controllerstats_uncleanleaderelectionspersec_total{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"}[5m]))
      '3':
        kind: Panel
        spec:
          display:
            name: Online Replicas
            description: Replicas that are online
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#d44a3a'
                  value: 0
                - color: '#ed8128'
                  value: 0
                - color: '#299c46'
                  value: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_server_replicamanager_partitioncount{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"})
      '4':
        kind: Panel
        spec:
          display:
            name: Under Replicated Partitions
            description: Number of under-replicated partitions (| ISR | < | all replicas |).
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#508642'
                  value: 0
                - color: '#ed8128'
                  value: 1
                - color: '#bf1b00'
                  value: 5
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_server_replicamanager_underreplicatedpartitions{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"})
      '5':
        kind: Panel
        spec:
          display:
            name: Partitions at minimum ISR
            description: Number of partitions which are at their minimum in sync replica count (| ISR | == | min.insync.replicas |)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    color: '#508642'
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#508642'
                  value: 0
                - color: '#ef843c'
                  value: 1
                - color: '#bf1b00'
                  value: 5
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_cluster_partition_atminisr{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"})
      '6':
        kind: Panel
        spec:
          display:
            name: Partitions under minimum ISR
            description: Number of partitions which are under their minimum in sync replica count (| ISR | < | min.insync.replicas |)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    color: '#508642'
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#508642'
                  value: 0
                - color: '#ef843c'
                  value: 1
                - color: '#bf1b00'
                  value: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_cluster_partition_underminisr{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"})
      '7':
        kind: Panel
        spec:
          display:
            name: Offline Partitions Count
            description: "Number of partitions that don\u2019t have an active leader and are hence not writable or readable"
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#508642'
                  value: 0
                - color: '#ef843c'
                  value: 1
                - color: '#bf1b00'
                  value: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_controller_kafkacontroller_offlinepartitionscount{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"})
      '8':
        kind: Panel
        spec:
          display:
            name: Fenced Brokers
            description: Number of brokers fenced by the controller. A fenced broker cannot host partition leaders or be in the ISR
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#508642'
                  value: 0
                - color: '#ef843c'
                  value: 1
                - color: '#bf1b00'
                  value: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: max(kafka_controller_kafkacontroller_fencedbrokercount{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"})
      '9':
        kind: Panel
        spec:
          display:
            name: Offline Replicas
            description: Number of partition replicas that are offline, for example because of a failed log directory
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#508642'
                  value: 0
                - color: '#ef843c'
                  value: 1
                - color: '#bf1b00'
                  value: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kafka_server_replicamanager_offlinereplicacount{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"})
      '10':
        kind: Panel
        spec:
          display:
            name: ISR Shrink / Expand Rate
            description: Rate at which partition leaders shrink or expand their in-sync replica set. Frequent changes point to followers falling behind or brokers going up and down
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#299c46'
                  value: 0
                - color: '#ed8128'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(irate(kafka_server_replicamanager_isrshrinkspersec_total{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"}[5m]))
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(irate(kafka_server_replicamanager_isrexpandspersec_total{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"}[5m]))
      '11':
        kind: Panel
        spec:
          display:
            name: Failed ISR Update Rate
            description: Rate of failed attempts by partition leaders to update the in-sync replica set
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#299c46'
                  value: 0
                - color: '#ed8128'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(irate(kafka_server_replicamanager_failedisrupdatespersec_total{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"}[5m]))
      '12_0':
        kind: Panel
        spec:
          display:
            name: Memory Usage
            description: Kafka broker pods memory usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(container_memory_usage_bytes{namespace=~"$namespace",pod=~".*$kafka_broker",container="kafka"}) by (pod)
      '12_1':
        kind: Panel
        spec:
          display:
            name: CPU Usage
            description: Aggregated Kafka broker pods CPU usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(container_cpu_usage_seconds_total{namespace=~"$namespace",pod=~".*$kafka_broker",container="kafka"}[5m])) by (pod)
      '12_2':
        kind: Panel
        spec:
          display:
            name: Available Disk Space
            description: Kafka broker pods disk usage
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(kubelet_volume_stats_available_bytes{namespace=~"$namespace",persistentvolumeclaim=~"data(-[0-9]+)?-$strimzi_cluster_name-$kafka_broker", persistentvolumeclaim!~".*zookeeper(-[0-9]+)?$"})
                    by (persistentvolumeclaim)
      '12_3':
        kind: Panel
        spec:
          display:
            name: Open File Descriptors
            description: Open File Descriptors
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
