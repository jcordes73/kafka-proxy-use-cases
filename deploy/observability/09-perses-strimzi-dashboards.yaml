              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(jvm_gc_pause_seconds_count{container=~"user-operator|topic-operator|strimzi-cluster-operator"}[5m])) by (container)
---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: strimzi-cruise-control
  namespace: kafka
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: perses-observability-operator
  config:
    display:
      name: Strimzi Cruise Control
      description: Converted from the Strimzi Grafana dashboard (strimzi-cruise-control) to Perses. Metrics use Kafka 4.x naming, verified against the live cluster; queries target the user-workload-monitoring
        datasource (Thanos Querier).
    duration: '6h'
    refreshInterval: '1m'
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowMultiple: false
        allowAllValue: false
        display:
          name: Namespace
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: namespace
            matchers:
            - kafka_cruisecontrol_loadmonitor_valid_windows_value
    - kind: ListVariable
      spec:
        name: strimzi_cluster_name
        allowMultiple: false
        allowAllValue: false
        display:
          name: Cluster Name
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: strimzi_io_cluster
            matchers:
            - kafka_cruisecontrol_loadmonitor_valid_windows_value
    layouts:
    - kind: Grid
      spec:
        display:
          title: Panel Group 1
        items:
        - x: 0
          y: 0
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/0'
        - x: 4
          y: 0
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/1'
        - x: 8
          y: 0
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/2'
        - x: 12
          y: 0
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/3'
        - x: 16
          y: 0
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/4'
    - kind: Grid
      spec:
        display:
          title: Cruise Control
          collapse:
            open: true
        items:
        - x: 0
          y: 5
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/5_0'
        - x: 12
          y: 5
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/5_1'
        - x: 0
          y: 13
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/5_2'
        - x: 12
          y: 13
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/5_3'
        - x: 0
          y: 21
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/5_4'
        - x: 12
          y: 21
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/5_5'
    - kind: Grid
      spec:
        display:
          title: Cruise Control REST API
          collapse:
            open: true
        items:
        - x: 0
          y: 30
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/6_0'
        - x: 12
          y: 30
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/6_1'
        - x: 0
          y: 38
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/6_2'
        - x: 12
          y: 38
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/6_3'
    - kind: Grid
      spec:
        display:
          title: JVM & Resources
          collapse:
            open: true
        items:
        - x: 0
          y: 47
          width: 8
          height: 7
          content:
            $ref: '#/spec/panels/7_0'
        - x: 8
          y: 47
          width: 8
          height: 7
          content:
            $ref: '#/spec/panels/7_1'
        - x: 16
          y: 47
          width: 8
          height: 7
          content:
            $ref: '#/spec/panels/7_2'
        - x: 0
          y: 54
          width: 8
          height: 7
          content:
            $ref: '#/spec/panels/7_3'
        - x: 8
          y: 54
          width: 8
          height: 7
          content:
            $ref: '#/spec/panels/7_4'
    panels:
      '0':
        kind: Panel
        spec:
          display:
            name: Total Monitored Windows
            description: The number of snapshot windows that are monitored
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#d44a3a'
                  value: 0
                - color: '#ed8128'
                  value: 0
                - color: '#299c46'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_loadmonitor_total_monitored_windows_value{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"}
      '1':
        kind: Panel
        spec:
          display:
            name: Valid Windows
            description: Number of time windows considered to be valid because of enough samples for computing a proposal.
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#299c46'
                  value: 0
                - color: '#e5ac0e'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_loadmonitor_valid_windows_value{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"}
      '2':
        kind: Panel
        spec:
          display:
            name: Ongoing Execution
            description: Number of ongoing executions running for proposals or rebalance
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#299c46'
                  value: 0
                - color: '#ed8128'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_executor_ongoing_execution_non_kafka_assigner_value{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"}
      '3':
        kind: Panel
        spec:
          display:
            name: Balancedness Score
            description: The current balancedness score of the Kafka cluster as calculated by the anomaly detector (every 5 minutes by default)
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#d44a3a'
                  value: 0
                - color: '#FF780A'
                  value: 50
                - color: '#299c46'
                  value: 80
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_anomalydetector_balancedness_score_value{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"}
      '4':
        kind: Panel
        spec:
          display:
            name: Monitored Partition
            description: Monitored Partition Percentage
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: percent-decimal
              mappings:
              - kind: Misc
                spec:
                  result:
                    value: N/A
                  value: 'null'
              thresholds:
                steps:
                - color: '#299c46'
                  value: 0
                - color: '#ed8128'
                  value: 2
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_loadmonitor_monitored_partitions_percentage_value{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name"}
      '5_0':
        kind: Panel
        spec:
          display:
            name: Goal Violations
            description: Goal violations per anomaly detector execution. Because Cruise Control emits cumulative counts, the Prometheus query window must be set to the anomaly detector run interval to preserve
              discrete per run counts (5 minutes by default)
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: violations
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: round(max_over_time(increase(kafka_cruisecontrol_anomalydetector_goal_violation_rate_count{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}[10m])[10m:]))
      '5_1':
        kind: Panel
        spec:
          display:
            name: Kafka Reported Disk Failure Rate
            description: Disk read failures reported by Kafka
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: failures/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(irate(kafka_cruisecontrol_anomalydetector_disk_failure_rate_count{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}[5m]))
      '5_2':
        kind: Panel
        spec:
          display:
            name: Partition Samples Fetcher Failure Rate
            description: Partition Samples Fetcher Failure Rate
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: failures/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(irate(kafka_cruisecontrol_metricfetchermanager_partition_samples_fetcher_failure_rate_count{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}[5m]))
      '5_3':
        kind: Panel
        spec:
          display:
            name: Training Samples Fetcher Failure Rate
            description: Training Samples Fetcher Failure Rate
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: failures/sec
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(irate(kafka_cruisecontrol_metricfetchermanager_training_samples_fetcher_failure_rate_count{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}[5m]))
      '5_4':
        kind: Panel
        spec:
          display:
            name: Proposal Computation Time
            description: Proposal Computation Time
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: ms
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_goaloptimizer_proposal_computation_timer_max{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_goaloptimizer_proposal_computation_timer_mean{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_goaloptimizer_proposal_computation_timer_99thpercentile{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_goaloptimizer_proposal_computation_timer_999thpercentile{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}
      '5_5':
        kind: Panel
        spec:
          display:
            name: Cluster Model Creation Time
            description: Cluster Model Creation Time
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              querySettings:
              - colorMode: fixed
                colorValue: '#8ab8ff'
                queryIndex: 2
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: decimal
                label: ms
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_loadmonitor_cluster_model_creation_timer_max{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_loadmonitor_cluster_model_creation_timer_mean{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_loadmonitor_cluster_model_creation_timer_99thpercentile{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: kafka_cruisecontrol_loadmonitor_cluster_model_creation_timer_999thpercentile{namespace=~"$namespace",strimzi_io_cluster=~"$strimzi_cluster_name",pod=~"$strimzi_cluster_name-cruise-control-.*"}
      '6_0':
        kind: Panel
        spec:
          display:
            name: Rebalance Request Rate
            description: Rebalance Request Rate
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
