---
apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: strimzi-kafka-bridge
  namespace: kafka
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: perses-observability-operator
  config:
    display:
      name: Strimzi Kafka Bridge
      description: Converted from the Strimzi Grafana dashboard (strimzi-kafka-bridge) to Perses. Metrics use Kafka 4.x naming, verified against the live cluster; queries target the user-workload-monitoring
        datasource (Thanos Querier).
    duration: '6h'
    refreshInterval: '1m'
    variables:
    - kind: ListVariable
      spec:
        name: namespace
        allowMultiple: false
        allowAllValue: false
        display:
          name: Namespace
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: namespace
            matchers:
            - strimzi_bridge_http_server_active_connections
    - kind: ListVariable
      spec:
        name: bridge_container_name
        allowMultiple: false
        allowAllValue: false
        display:
          name: Container Name
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: strimzi_io_name
            matchers:
            - strimzi_bridge_http_server_active_connections
    layouts:
    - kind: Grid
      spec:
        display:
          title: Overview
          collapse:
            open: true
        items:
        - x: 0
          y: 1
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/0_0'
        - x: 4
          y: 1
          width: 4
          height: 4
          content:
            $ref: '#/spec/panels/0_1'
    - kind: Grid
      spec:
        display:
          title: Kafka
          collapse:
            open: false
        items:
        - x: 0
          y: 6
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_0'
        - x: 12
          y: 6
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_1'
        - x: 0
          y: 14
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_2'
        - x: 12
          y: 14
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_3'
        - x: 0
          y: 22
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_4'
        - x: 12
          y: 22
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_5'
        - x: 0
          y: 30
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_6'
        - x: 12
          y: 30
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_7'
        - x: 0
          y: 38
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_8'
        - x: 12
          y: 38
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_9'
        - x: 0
          y: 46
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/1_10'
    - kind: Grid
      spec:
        display:
          title: HTTP
          collapse:
            open: true
        items:
        - x: 0
          y: 7
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/2_0'
        - x: 12
          y: 7
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/2_1'
        - x: 0
          y: 15
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/2_2'
        - x: 12
          y: 15
          width: 12
          height: 8
          content:
            $ref: '#/spec/panels/2_3'
        - x: 0
          y: 23
