# deploy/observability/01-metrics-netpols.yaml — Step 1.2 (openshift-setup.md)
# Additive policies letting the user-workload monitoring namespace scrape the
# locked-down components (backend Kafka pods, DMZ bridge), only on their metrics ports.
---
# Broker namespaces: openshift-user-workload-monitoring may scrape 9404
# (metricsConfig). The brokers live in kafka-cluster-1/kafka-cluster-2, so
# each of those locked-down namespaces gets its own additive policy.
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-monitoring
  namespace: kafka-cluster-1
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: Kafka
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 9404
          protocol: TCP
---
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-monitoring
  namespace: kafka-cluster-2
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: Kafka
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 9404
          protocol: TCP
---
# Bridge namespace: openshift-user-workload-monitoring may scrape 8080 (REST API + /metrics)
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: my-bridge-allow-monitoring
  namespace: kafka-http-bridge
spec:
  podSelector:
    matchLabels:
      strimzi.io/kind: KafkaBridge
      strimzi.io/cluster: my-bridge
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
      ports:
        - port: 8080
          protocol: TCP
