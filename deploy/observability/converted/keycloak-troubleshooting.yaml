apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: keycloak-troubleshooting
  namespace: kafka
spec:
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: perses-observability-operator
  config:
    display:
      name: Keycloak troubleshooting dashboard
      description: Converted from the Keycloak Grafana dashboard (keycloak/keycloak-grafana-dashboard) to Perses. Scraped from the Red Hat build of Keycloak management port (9000, HTTPS); queries target
        the user-workload-monitoring datasource (Thanos Querier).
    duration: 6h
    refreshInterval: 1m
    variables:
    - kind: ListVariable
      spec:
        name: caffeine_cache
        allowMultiple: true
        allowAllValue: true
        display:
          name: cache
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: cache
            matchers:
            - cache_evictions_count
        customAllValue: .*
    - kind: ListVariable
      spec:
        name: ispn_clustered_caches
        allowMultiple: true
        allowAllValue: true
        display:
          name: cache
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: cache
            matchers:
            - vendor_rpc_manager_replication_count
        customAllValue: .*
    - kind: ListVariable
      spec:
        name: ispn_local_cache
        allowMultiple: true
        allowAllValue: true
        display:
          name: cache
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: cache
            matchers:
            - vendor_statistics_hits
        customAllValue: .*
    - kind: ListVariable
      spec:
        name: jdbc_cache_names
        allowMultiple: true
        allowAllValue: true
        display:
          name: cache
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: cache
            matchers:
            - cache_evictions_count
        customAllValue: .*
    - kind: ListVariable
      spec:
        name: namespace
        allowMultiple: false
        allowAllValue: true
        display:
          name: namespace
          hidden: false
        plugin:
          kind: PrometheusLabelValuesVariable
          spec:
            datasource:
              kind: PrometheusDatasource
              name: user-workload-monitoring
            labelName: namespace
            matchers:
            - up
        customAllValue: .*
    layouts:
    - kind: Grid
      spec:
        display:
          title: SLO Metrics
          collapse:
            open: true
        items:
        - x: 0
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/0'
        - x: 3
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/1'
        - x: 6
          y: 0
          width: 3
          height: 4
          content:
            $ref: '#/spec/panels/2'
        - x: 0
          y: 4
          width: 6
          height: 11
          content:
            $ref: '#/spec/panels/3'
        - x: 6
          y: 4
          width: 6
          height: 11
          content:
            $ref: '#/spec/panels/4'
    - kind: Grid
      spec:
        display:
          title: JVM Metrics
          collapse:
            open: true
        items:
        - x: 6
          y: 15
          width: 6
          height: 11
