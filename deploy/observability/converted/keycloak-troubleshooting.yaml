    panels:
      '0':
        kind: Panel
        spec:
          display:
            name: Availability
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: percent-decimal
              thresholds:
                steps:
                - color: '#f2495c'
                  value: 0
                - color: '#73bf69'
                  value: 99.9
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: count_over_time( sum (up{ container="keycloak", namespace=~"$namespace" } > 0)[6h:5m] ) / count_over_time(vector(1)[6h:5m])
      '1':
        kind: Panel
        spec:
          display:
            name: Responses below 250ms
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: percent-decimal
              thresholds:
                steps:
                - color: '#f2495c'
                  value: 0
                - color: '#73bf69'
                  value: 0.95
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum( rate( http_server_requests_seconds_bucket{ uri=~"/realms/{realm}/protocol/{protocol}/.*|/realms/{realm}/login-actions/.*", le="0.25", container="keycloak", namespace=~"$namespace"}
                    [6h] ) ) without (le,uri,status,outcome,method,pod,instance) / sum( rate( http_server_requests_seconds_count{ uri=~"/realms/{realm}/protocol/{protocol}/.*|/realms/{realm}/login-actions/.*",
                    container="keycloak", namespace=~"$namespace"} [6h] ) ) without (le,uri,status,outcome,method,pod,instance)
      '2':
        kind: Panel
        spec:
          display:
            name: Error responses
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: percent-decimal
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
                - color: '#f2495c'
                  value: 0.001
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum( rate( http_server_requests_seconds_count{ uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions.*", outcome="SERVER_ERROR", container="keycloak", namespace=~"$namespace"}
                    [6h] ) ) or vector(0) / sum( rate( http_server_requests_seconds_count{ uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions.*", container="keycloak", namespace=~"$namespace"}
                    [6h] ) )
      '3':
        kind: Panel
        spec:
          display:
            name: Changes in % of responses below 250ms
            description: This Prometheus query calculates the percentage of authentication requests that completed within 0.25 seconds relative to all authentication requests for specific Keycloak endpoints,
              targeting a parti
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent-decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum( irate( http_server_requests_seconds_bucket{ uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions.*", le="0.25", container="keycloak", namespace=~"$namespace"}
                    [5m] ) ) without (le,uri,status,outcome,method,instance) / sum( irate( http_server_requests_seconds_count{ uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions.*",
                    container="keycloak", namespace=~"$namespace"} [5m] ) ) without (le,uri,status,outcome,method,instance)
                  seriesNameFormat: '{{pod}}'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum( irate( http_server_requests_seconds_bucket{ uri=~"/realms/{realm}/protocol/{protocol}/.*|/realms/{realm}/login-actions/.*", le="0.25", container="keycloak", namespace=~"$namespace"}
                    [5m] ) ) without (le,uri,status,outcome,method,pod,instance) / sum( irate( http_server_requests_seconds_count{ uri=~"/realms/{realm}/protocol/{protocol}/.*|/realms/{realm}/login-actions/.*",
                    container="keycloak", namespace=~"$namespace"} [5m] ) ) without (le,uri,status,outcome,method,pod,instance)
                  seriesNameFormat: All pods
      '4':
        kind: Panel
        spec:
          display:
            name: Changes in % of Error responses
            description: This Prometheus query calculates the percentage of authentication requests that returned a server side error for all authentication requests, targeting a particular namespace, over
              the past 5 minutes.
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent-decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum by(uri) ( rate( http_server_requests_seconds_count{ outcome="SERVER_ERROR", uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions/.*", container="keycloak",
                    namespace=~"$namespace"} [5m] ) ) / sum by (uri) ( rate( http_server_requests_seconds_count{ uri=~"/realms/{realm}/protocol/{protocol}.*|/realms/{realm}/login-actions/.*", container="keycloak",
                    namespace=~"$namespace"} [5m] ) )
      '5':
        kind: Panel
        spec:
          display:
            name: KUBERNETES - CPU Usage percentage
            description: This is available only in Kubernetes and only if your pods have cpu limits set
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: percent-decimal
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum(rate(container_cpu_usage_seconds_total{container="keycloak", namespace=~"$namespace"}[5m])) by (pod) / on(pod) group_left sum(kube_pod_container_resource_limits{container="keycloak",
                    namespace=~"$namespace", resource="cpu"}) by (pod)
      '6':
        kind: Panel
        spec:
          display:
            name: Average memory usage
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: bytes
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum_over_time((sum by (pod) (jvm_memory_used_bytes{namespace=~"$namespace"}))[6h:5m]) / count_over_time((sum by (pod) (jvm_memory_used_bytes{namespace=~"$namespace"}))[6h:5m])
      '7':
        kind: Panel
        spec:
          display:
            name: JVM memory used vs committed
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: bytes
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum by (pod) (jvm_memory_used_bytes{namespace=~"$namespace"})
                  seriesNameFormat: '{{pod}} - used'
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum by (pod) (jvm_memory_committed_bytes{namespace=~"$namespace"})
                  seriesNameFormat: '{{pod}} - committed'
      '8':
        kind: Panel
        spec:
          display:
            name: Average GC time
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              colorMode: value
              format:
                unit: seconds
              thresholds:
                steps:
                - color: '#73bf69'
                  value: 0
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum( rate( jvm_gc_pause_seconds_sum{ container="keycloak", namespace=~"$namespace"} [6h] ) ) without (action,instance,cause) / sum( rate( jvm_gc_pause_seconds_count{ container="keycloak",
                    namespace=~"$namespace"} [6h] ) ) without (action,instance,cause)
                  seriesNameFormat: '{{pod}} - {{gc}}'
      '9':
        kind: Panel
        spec:
          display:
            name: Changes in average GC times in 5 minutes interval
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum by (pod,cause)(irate(jvm_gc_pause_seconds_sum{container="keycloak", namespace=~"$namespace"}[5m]))
                  seriesNameFormat: '{{pod}} - {{cause}}'
      '10':
        kind: Panel
        spec:
          display:
            name: Number of GC events in 5 minutes interval
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: sum by (pod,cause)(irate(jvm_gc_pause_seconds_count{container="keycloak", namespace=~"$namespace"}[5m]))
                  seriesNameFormat: '{{pod}} - {{cause}}'
      '11':
        kind: Panel
        spec:
          display:
            name: Maximum GC time and cause
            description: I am not sure about this metric. I would expect _max to be only increasing number while here it is going up and down so I am not sure what this really means
          plugin:
            kind: TimeSeriesChart
            spec:
              legend:
                mode: list
                position: bottom
              visual:
                areaOpacity: 0.1
                connectNulls: false
                display: line
                lineWidth: 1
              yAxis:
                format:
                  unit: seconds
          queries:
          - kind: TimeSeriesQuery
            spec:
              plugin:
                kind: PrometheusTimeSeriesQuery
                spec:
                  datasource:
                    kind: PrometheusDatasource
                    name: user-workload-monitoring
                  query: max by (pod,cause) (jvm_gc_pause_seconds_max{container="keycloak", namespace=~"$namespace"})
                  seriesNameFormat: '{{pod}} - {{cause}}'
      '12':
        kind: Panel
        spec:
          display:
            name: JVM GC CPU overhead %
            description: The percentage of CPU time spent on garbage collection, indicating the impact of GC on application performance in the JVM. It refers to the proportion of the total CPU processing
