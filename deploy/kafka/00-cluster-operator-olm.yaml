# deploy/kafka/00-cluster-operator-olm.yaml — Step 3.1 (openshift-setup.md)
# Streams for Apache Kafka Cluster Operator, installed via OperatorHub/OLM
# (the Red Hat downstream operator — the guide's recommended install files
# path requires a subscription download; on OperatorHub-enabled clusters this
# is the equivalent OLM-managed install).
#
# Channel amq-streams-3.2.x is version-pinned to the Streams 3.2 release line
# (the `stable` channel tracks the same CSV today but will move to 3.3+).
# installPlanApproval: Manual so OLM does not auto-upgrade across minor
# versions — approve InstallPlans deliberately:
#   oc get installplan -n kafka
#   oc patch installplan <name> -n kafka-auth --type merge -p '{"spec":{"approved":true}}'
#
# WATCH SCOPE: the OperatorGroup targets the namespaces holding Strimzi-managed
# resources: the Kafka cluster namespaces (kafka-cluster-1/kafka-cluster-2),
# this operator namespace (kafka), and the bridge namespace (added in Step 7).
# When kafka-mm2 is created (MirrorMaker 2, Step 4), extend the target list —
# the operator deployment is stamped with olm.targetNamespaces and rolls
# automatically:
#   oc patch operatorgroup kafka-operator-group -n kafka --type merge \
#     -p '{"spec":{"targetNamespaces":["kafka","kafka-cluster-1","kafka-cluster-2","kafka-http-bridge","kafka-mm2"]}}'
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: kafka-operator-group
  namespace: kafka
spec:
  # Watch scope covers every namespace holding Strimzi-managed resources:
  # the two Kafka clusters (kafka-cluster-1/kafka-cluster-2), this operator
  # namespace (kafka), and the HTTP bridge (Step 7). Extending this list is
  # the OLM way to add a watched namespace — OLM regenerates the RBAC and
  # rolls the operator; no manual RoleBindings needed.
  targetNamespaces:
    - kafka
    - kafka-cluster-1
    - kafka-cluster-2
    - kafka-http-bridge
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: amq-streams
  namespace: kafka
spec:
  channel: amq-streams-3.2.x
  name: amq-streams
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
