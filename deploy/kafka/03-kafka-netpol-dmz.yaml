# deploy/kafka/03-kafka-netpol-dmz.yaml — Step 3.4 (docs/03-kafka-cluster.md)
# Backend lockdown (the DMZ/backend split) for both Kafka clusters:
# default-deny + same-namespace +
# proxy-namespace-only on the client-facing listener ports (9092/9093).
# NOTE: In Strimzi 0.51 the listener ports are additionally governed by the
# operator-generated <cluster-name>-network-policy-kafka — hence the
# per-listener networkPolicyPeers in 02-kafka.yaml must match this intent.
---
# 1. Default deny: no ingress to the kafka-cluster-1 pods at all
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: kafka-cluster-1-deny-ingress
  namespace: kafka-cluster-1
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: kafka-cluster-1
  policyTypes:
    - Ingress
  ingress: []
---
# 2. Allow all traffic from within the kafka-cluster-1 namespace
#    (control plane 9091, broker replication, Cluster/Entity Operator)
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: kafka-cluster-1-allow-same-namespace
  namespace: kafka-cluster-1
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: kafka-cluster-1
  ingress:
    - from:
        - podSelector: {}   # any pod in the kafka-cluster-1 namespace
---
# 3. DMZ ingress: only the kafka-proxy namespace, only on client-facing ports.
#    MirrorMaker 2 (Step 4, kafka-mm2) additionally reaches the PLAIN listener
#    only — it replicates between the two clusters over the unauthenticated
#    plain listener (see docs/04-mirrormaker2.md).
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: kafka-cluster-1-allow-proxy
  namespace: kafka-cluster-1
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: kafka-cluster-1
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-proxy
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-mm2
      ports:
        - port: 9092
          protocol: TCP
---
# 4. Default deny: no ingress to the kafka-cluster-2 pods at all
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: kafka-cluster-2-deny-ingress
  namespace: kafka-cluster-2
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: kafka-cluster-2
  policyTypes:
    - Ingress
  ingress: []
---
# 5. Allow all traffic from within the kafka-cluster-2 namespace
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: kafka-cluster-2-allow-same-namespace
  namespace: kafka-cluster-2
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: kafka-cluster-2
  ingress:
    - from:
        - podSelector: {}   # any pod in the kafka-cluster-2 namespace
---
# 6. DMZ ingress: only the kafka-proxy namespace, only on client-facing ports.
#    MirrorMaker 2 (Step 4, kafka-mm2) additionally reaches the PLAIN listener
#    only — it replicates between the two clusters over the unauthenticated
#    plain listener (see docs/04-mirrormaker2.md).
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: kafka-cluster-2-allow-proxy
  namespace: kafka-cluster-2
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: kafka-cluster-2
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-proxy
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka-mm2
      ports:
        - port: 9092
          protocol: TCP
