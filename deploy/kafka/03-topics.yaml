# deploy/kafka/03-topics.yaml — shared demo topics on both clusters (Step 3)
# topic-A / topic-B / topic-C declared as KafkaTopic resources (the Topic
# Operator — Step 3.2 entityOperator — reconciles them). metadata.name must be
# lowercase (RFC 1123); spec.topicName carries the actual Kafka topic name
# (topic-A/B/C with uppercase). Replication factor 3 (one per broker) — the
# operator CANNOT change a topic's RF, so the original RF-1 topics were
# deleted (via these resources) and recreated by re-applying this manifest.
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: topic-a
  namespace: kafka-cluster-1
  labels:
    strimzi.io/cluster: kafka-cluster-1
spec:
  topicName: topic-A
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: topic-b
  namespace: kafka-cluster-1
  labels:
    strimzi.io/cluster: kafka-cluster-1
spec:
  topicName: topic-B
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: topic-c
  namespace: kafka-cluster-1
  labels:
    strimzi.io/cluster: kafka-cluster-1
spec:
  topicName: topic-C
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: topic-a
  namespace: kafka-cluster-2
  labels:
    strimzi.io/cluster: kafka-cluster-2
spec:
  topicName: topic-A
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: topic-b
  namespace: kafka-cluster-2
  labels:
    strimzi.io/cluster: kafka-cluster-2
spec:
  topicName: topic-B
  partitions: 3
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: topic-c
  namespace: kafka-cluster-2
  labels:
    strimzi.io/cluster: kafka-cluster-2
spec:
  topicName: topic-C
  partitions: 3
  replicas: 3
