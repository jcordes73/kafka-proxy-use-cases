# deploy/kafka/01-kafka-nodepool.yaml — Step 3.2 (docs/03-kafka-cluster.md)
# One dual-role (broker + controller) KRaft node pool per cluster, dev-sized
# (ephemeral storage). Cluster names match their namespaces: kafka-cluster-1
# and kafka-cluster-2.
# The cluster namespaces ship here (nothing else creates them — the Cluster
# Operator's watch scope includes them from Step 3.1, and OLM returns 403
# for informers against non-existent namespaces, which kills the operator):
kind: Namespace
apiVersion: v1
metadata:
  name: kafka-cluster-1
  annotations:
    openshift.io/description: "Kafka cluster 1 (secure backend for the proxy)"
---
kind: Namespace
apiVersion: v1
metadata:
  name: kafka-cluster-2
  annotations:
    openshift.io/description: "Kafka cluster 2 (MirrorMaker 2 target)"
---
kind: Namespace
apiVersion: v1
metadata:
  name: kafka-http-bridge
  annotations:
    openshift.io/description: "Kafka HTTP Bridge DMZ namespace"
---
kind: KafkaNodePool
apiVersion: kafka.strimzi.io/v1
metadata:
  name: dual-role
  namespace: kafka-cluster-1
  labels:
    strimzi.io/cluster: kafka-cluster-1
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
---
kind: KafkaNodePool
apiVersion: kafka.strimzi.io/v1
metadata:
  name: dual-role
  namespace: kafka-cluster-2
  labels:
    strimzi.io/cluster: kafka-cluster-2
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: ephemeral
