# deploy/kafka/01-kafka-nodepool.yaml — Step 3.2 (docs/03-kafka-cluster.md)
# One dual-role (broker + controller) KRaft node pool per cluster with
# persistent-claim storage (10Gi per broker; PVCs survive a cluster uninstall
# — deleteClaim: false). Cluster names match their namespaces: kafka-cluster-1
# and kafka-cluster-2. The cluster namespaces ship in 00-cluster-namespaces.yaml
# (created before the Cluster Operator in Step 3.1); kafka-mm2 ships in
# deploy/mirrormaker2/00-namespace.yaml.
---
kind: KafkaNodePool
apiVersion: kafka.strimzi.io/v1
metadata:
  name: dual-role
  namespace: kafka-cluster-1
  labels:
    strimzi.io/cluster: kafka-cluster-1
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    # class: <storage-class>   # omit to use the cluster's default StorageClass
    deleteClaim: false
---
kind: KafkaNodePool
apiVersion: kafka.strimzi.io/v1
metadata:
  name: dual-role
  namespace: kafka-cluster-2
  labels:
    strimzi.io/cluster: kafka-cluster-2
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 10Gi
    # class: <storage-class>   # omit to use the cluster's default StorageClass
    deleteClaim: false
