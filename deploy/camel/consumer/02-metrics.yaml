# deploy/camel/consumer/02-metrics.yaml — Step 15.8 (openshift-setup.md)
# Service + ServiceMonitor registering the Quarkus Micrometer endpoint
# (/q/metrics on the app port 8080) with user-workload monitoring.
apiVersion: v1
kind: Service
metadata:
  name: camel-kafka-consumer
  namespace: kafka-consumer
  labels:
    app: camel-kafka-consumer   # ServiceMonitor selects Services by this label
spec:
  selector:
    app: camel-kafka-consumer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: camel-kafka-consumer
  namespace: kafka-consumer
spec:
  selector:
    matchLabels:
      app: camel-kafka-consumer
  endpoints:
    - port: http
      path: /q/metrics
