# deploy/camel/consumer/src/main/resources/application.properties — Step 14.3
# Point at the PROXY's clusterIP bootstrap (not the Kafka cluster's).
# camel.component.kafka.* (NOT kafka.bootstrap.servers — that configures quarkus-kafka)
# TLS: the virtual cluster ingress speaks TLS (guide Step 5) — trust the proxy CA
# mounted at /etc/proxy-ca (Step 14.4). These are camelCase component options, so
# they live here rather than in CAMEL_COMPONENT_KAFKA_* env vars (env var
# underscore-mapping would turn securityProtocol into the invalid
# "security.protocol" and fail Camel's strict property binding at startup).
# SASL/OAUTHBEARER: saslAuthType=OAUTH derives securityProtocol=SASL_SSL and
# saslMechanism=OAUTHBEARER (Apache Kafka's native OAuth handler — no extra
# dependency). The SASL exchange passes through the proxy and the brokers
# validate the token against Keycloak's JWKS. Credentials come from the
# camel-consumer Keycloak client (deploy/keycloak/04-kafka-realm-import.yaml);
# the secret is injected via the OAUTH_CLIENT_SECRET env var (Step 14.4).
# The Deployment also sets org.apache.kafka.sasl.oauthbearer.allowed.urls —
# Kafka 4.x rejects http token endpoints unless allowlisted (JAVA_OPTS_APPEND).
camel.component.kafka.brokers=kafka-cluster-1-cluster-ip-1-bootstrap.kafka-proxy.svc.cluster.local:9292
camel.component.kafka.saslAuthType=OAUTH
camel.component.kafka.oauthClientId=camel-consumer
camel.component.kafka.oauthClientSecret=${OAUTH_CLIENT_SECRET}
camel.component.kafka.oauthTokenEndpointUri=http://keycloak-http.kafka-auth.svc.cluster.local:8080/realms/kafka/protocol/openid-connect/token
camel.component.kafka.sslTruststoreLocation=/etc/proxy-ca/ca.crt
camel.component.kafka.sslTruststoreType=PEM
