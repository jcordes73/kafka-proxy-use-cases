# deploy/apicurio/02-postgres.yaml — Step 5.2 (openshift-setup.md)
# PostgreSQL for Apicurio Registry, persisted via a volumeClaimTemplate
# (gp3-csi by default). Previously ephemeral (emptyDir): the registry's
# schemas were lost on every pod recreation — the record-validation filter's
# pinned apicurioId then pointed at a missing artifact. With persistence the
# artifacts survive pod recreation; nothing else in the deployment changes.
# A volumeClaimTemplate cannot be added to an existing StatefulSet — migrate
# with pg_dump first, then delete + re-apply this file and pg_restore.
#
# storage.type: postgresql is one of the Apicurio Registry 3 storage options
# (kafkasql, kubernetesops, mysql, postgresql). kafkasql would reuse the Kafka
# cluster but requires widening the Step 3.4 DMZ NetworkPolicy to admit the
# registry namespace — postgresql keeps the DMZ closed.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: registry-postgresql-db
  namespace: kafka-registry
spec:
  serviceName: registry-postgresql-db-service
  selector:
    matchLabels:
      app: registry-postgresql-db
  replicas: 1
  template:
    metadata:
      labels:
        app: registry-postgresql-db
    spec:
      containers:
        - name: registry-postgresql-db
          image: postgres:15
          volumeMounts:
            - mountPath: /data
              name: registry-postgresql-data
          env:
            - name: POSTGRES_USER
              value: registryuser
            - name: POSTGRES_PASSWORD
              value: registrypassword
            - name: PGDATA
              value: /data/pgdata
            - name: POSTGRES_DB
              value: apicurioregistry
  volumeClaimTemplates:
    - metadata:
        name: registry-postgresql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: registry-postgres-db
  namespace: kafka-registry
spec:
  selector:
    app: registry-postgresql-db
  ports:
    - port: 5432
      targetPort: 5432
