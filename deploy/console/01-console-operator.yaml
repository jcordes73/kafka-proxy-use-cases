# deploy/console/01-console-operator.yaml — Step 13.1 (openshift-setup.md)
# Namespace + OperatorGroup + Subscription for the Streams for Apache Kafka
# Console operator (package amq-streams-console, Red Hat Operators catalog),
# applied as a single transaction.
#
# The operator supports AllNamespaces installs only — the OperatorGroup is
# global (no targetNamespaces), so one operator instance manages Console
# resources in every namespace.
#
# Channel amq-streams-3.2.x aligns with the Streams for Apache Kafka 3.2 line.
#
# NOTE: installPlanApproval is Manual so OLM does not auto-upgrade the console
# operator. Approve InstallPlans deliberately: `oc get installplan -n kafka-console`
# then `oc patch installplan <name> -n kafka-console --type merge -p '{"spec":{"approved":true}}'`.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kafka-console
  annotations:
    openshift.io/description: "Streams for Apache Kafka Console"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: console-operator-group
  namespace: kafka-console
spec: {}   # global OperatorGroup — AllNamespaces install mode
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: amq-streams-console
  namespace: kafka-console
spec:
  channel: amq-streams-3.2.x
  name: amq-streams-console
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Manual
