apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.33.4.1
    app.quarkus.io/vcs-uri: file:///home/runner/work/console/console.git
    app.quarkus.io/build-timestamp: 2026-10-20 - 15:23:25 +0000
    prometheus.io/scrape: "true"
    prometheus.io/path: /q/metrics
    prometheus.io/port: "8080"
    prometheus.io/scheme: http
  labels:
    app.kubernetes.io/managed-by: quarkus
    app.kubernetes.io/version: 0.14.2
    app.kubernetes.io/name: streamshub-console-operator
  name: streamshub-console-operator
  namespace: "kafka-console"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: streamshub-console-operator
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.33.4.1
        app.quarkus.io/vcs-uri: file:///home/runner/work/console/console.git
        app.quarkus.io/build-timestamp: 2026-10-20 - 15:23:25 +0000
        prometheus.io/scrape: "true"
        prometheus.io/path: /q/metrics
        prometheus.io/port: "8080"
        prometheus.io/scheme: http
      labels:
        app.kubernetes.io/name: streamshub-console-operator
        app.kubernetes.io/managed-by: quarkus
        app.kubernetes.io/version: 0.14.2
    spec:
      containers:
        - env:
            - name: CONSOLE_DEPLOYMENT_DEFAULT_IMAGE_TAG
              valueFrom:
                fieldRef:
                  fieldPath: "metadata.labels['app.kubernetes.io/version']"
            - name: QUARKUS_OPERATOR_SDK_CONTROLLERS_CONSOLERECONCILER_NAMESPACES
              value: JOSDK_ALL_NAMESPACES
          image: quay.io/streamshub/console-operator:0.14.2
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/live
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          name: streamshub-console-operator
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 24
            httpGet:
              path: /q/health/started
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 10
      serviceAccountName: streamshub-console-operator
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.33.4.1
    app.quarkus.io/vcs-uri: file:///home/runner/work/console/console.git
    app.quarkus.io/build-timestamp: 2026-10-20 - 15:23:25 +0000
  labels:
    app.kubernetes.io/managed-by: quarkus
    app.kubernetes.io/version: 0.14.2
    app.kubernetes.io/name: streamshub-console-operator
  name: streamshub-console-operator
  namespace: "kafka-console"
spec:
  selector: {}
  endpoints:
    - scheme: http
      targetPort: 8080
      path: /q/metrics
      interval: 10s
      honorLabels: true
