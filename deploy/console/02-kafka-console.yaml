# deploy/console/02-kafka-console.yaml — Steps 13.2 + 13.3 + 15.7 (openshift-setup.md)
# Console connected to the PROXY's virtual cluster (never the brokers — the
# Step 0.4 DMZ would deny it anyway), secured with Keycloak OIDC (kafka-console
# client, standard flow), reading metrics from OpenShift user-workload
# monitoring instead of an embedded Prometheus.
apiVersion: console.streamshub.github.com/v1alpha1
kind: Console
metadata:
  name: kafka-console
  namespace: kafka-console
spec:
  hostname: kafka-console.${OPENSHIFT_APPS_DOMAIN}
  # Step 15.7 — read metrics from the user-workload Prometheus (no embedded instance)
  metricsSources:
    - name: uwm-prometheus
      type: openshift-monitoring
  kafkaClusters:
    - name: my-cluster
      kind: virtualkafkaclusters.kroxylicious.io   # proxy virtual cluster (3.2)
      namespace: kafka-proxy
      metricsSource: uwm-prometheus
      properties:
        values:
          # port is operator-allocated (guide Step 11)
          - name: bootstrap.servers
            value: my-cluster-cluster-ip-bootstrap.kafka-proxy.svc.cluster.local:9292
  # Step 13.3 — secure the console UI with Keycloak (kafka-console client).
  # The realm import (deploy/keycloak/04-kafka-realm-import.yaml) carries the
  # matching redirect URI and the `demo` user mapped to the administrators role.
  security:
    oidc:
      authServerUrl: https://keycloak-ingress-kafka-auth.${OPENSHIFT_APPS_DOMAIN}/realms/kafka
      clientId: kafka-console
      clientSecret:
        valueFrom:
          secretKeyRef:
            name: kafka-console-oidc-secret
            key: client-secret
    subjects:
      - include:
          - demo
        roleNames:
          - administrators
    roles:
      - name: administrators
        rules:
          - resources:
              - kafkas
            privileges:
              - 'ALL'
