# deploy/proxy/05-virtualkafkacluster.yaml — Steps 6.7–6.8 (docs/06-proxy.md)
# Wires proxy + ingress + backend together: one virtual cluster per backend
# KafkaService, each with its own TLS clusterIP ingress. The TLS block attaches
# the server certificate (Secret proxy-tls, wildcard SAN) to the ingress —
# required for clusterIP ingresses with protocol: TLS.
# filterRefs omitted on kafka-cluster-2: traffic passes through unchanged.
# kafka-cluster-1 carries the record-validation filter (Step 5) — validate
# basic connectivity first, then add filters one at a time (see the use case
# catalog in README.md).
kind: VirtualKafkaCluster
apiVersion: kroxylicious.io/v1alpha1
metadata:
  name: kafka-cluster-1
  namespace: kafka-proxy
spec:
  proxyRef:
    name: simple
  targetKafkaServiceRef:
    name: kafka-cluster-1
  ingresses:
    - ingressRef:
        name: cluster-ip-1
      tls:
        certificateRef:
          name: proxy-tls
          kind: Secret
  # ACL chain (verified working on the Red Hat build): SaslInspection first — it
  # authenticates the client and derives the subject the Authorization filter
  # needs (SaslInspection derives it from the JWT `sub` claim, so the ACL rules
  # must match that UUID form, not the preferred_username form) — then
  # record-validation, then Authorization (rules in rules-file before allow
  # rules, ends with `otherwise deny`).
  filterRefs:
    - name: sasl-inspection
    - name: record-validation
    - name: kafka-authorization
---
kind: VirtualKafkaCluster
apiVersion: kroxylicious.io/v1alpha1
metadata:
  name: kafka-cluster-2
  namespace: kafka-proxy
spec:
  proxyRef:
    name: simple
  targetKafkaServiceRef:
    name: kafka-cluster-2
  ingresses:
    - ingressRef:
        name: cluster-ip-2
      tls:
        certificateRef:
          name: proxy-tls
          kind: Secret
  # ACL chain: Authorization enforces the least-privilege ACL rules
  # (deploy/proxy/06-kafka-acl.yaml) before the brokers. NOTE: the upstream-only
  # OauthBearerValidation filter (which used to provide the subject here) is NOT
  # shipped in the Red Hat proxy operand and has been removed from the chain —
  # add it back only on the upstream build (kroxylicius 0.25.1 release, Step 6.1).
  # ACL chain (same as kafka-cluster-1, without record-validation): SaslInspection
  # authenticates the client and derives the subject (JWT `sub` UUID), the
  # Authorization filter enforces the least-privilege ACL rules
  # (deploy/proxy/06-kafka-acl.yaml) before the brokers. The upstream-only
  # OauthBearerValidation filter is NOT shipped in the Red Hat proxy operand —
  # add it back only on the upstream build (kroxylicius 0.25.1 release, Step 6.1).
  filterRefs:
    - name: sasl-inspection
    - name: kafka-authorization
