# deploy/proxy/04-kafkaservice.yaml — Step 6.5 (docs/06-proxy.md)
# The upstream (backend) Kafka clusters from Step 3, reached over their TLS
# listener (9093). strimziKafkaRef lets the operator discover the bootstrap
# address from the Strimzi Kafka CR's status and auto-trust the Strimzi
# cluster CA (Secret <cluster>-cluster-ca-cert) — no hardcoded bootstrap, no
# copied CA. One KafkaService per backend cluster; both live in the proxy
# namespace.
kind: KafkaService
apiVersion: kroxylicious.io/v1alpha1
metadata:
  namespace: kafka-proxy
  name: kafka-cluster-1
spec:
  strimziKafkaRef:
    name: kafka-cluster-1
    namespace: kafka-cluster-1
    listenerName: tls
    trustStrimziCaCertificate: true
  nodeIdRanges:
    - name: brokers
      start: 0
      end: 2
---
kind: KafkaService
apiVersion: kroxylicious.io/v1alpha1
metadata:
  namespace: kafka-proxy
  name: kafka-cluster-2
spec:
  strimziKafkaRef:
    name: kafka-cluster-2
    namespace: kafka-cluster-2
    listenerName: tls
    trustStrimziCaCertificate: true
  nodeIdRanges:
    - name: brokers
      start: 0
      end: 2
