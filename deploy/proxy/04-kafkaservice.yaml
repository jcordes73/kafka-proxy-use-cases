# deploy/proxy/04-kafkaservice.yaml — Step 6.5 (docs/06-proxy.md)
# The upstream (backend) Kafka clusters from Step 3, reached over their TLS
# listener (9093) via the Kafka clusters' bootstrap Services. Explicit
# `bootstrapServers` + `tls.trustAnchorRef` pointing at the Kafka cluster
# CA Secrets (copied into the proxy namespace) — this is the pattern the
# Red Hat proxy operator supports.
#
# WATCH SCOPE (verified live): the Red Hat operator (amq-streams-proxy
# v3.2.2-4) does NOT resolve cross-namespace `strimziKafkaRef` referents —
# it looks up the Kafka (and its CA) in the KafkaService's own
# namespace only and reports `ResolvedRefs=False: referenced Kafka resource
# not found`.
#
# One KafkaService per backend cluster; both live in the proxy namespace.
---
kind: KafkaService
apiVersion: kroxylicious.io/v1alpha1
metadata:
  namespace: kafka-proxy
  name: kafka-cluster-1
spec:
  bootstrapServers: kafka-cluster-1-kafka-bootstrap.kafka-cluster-1.svc.cluster.local:9093
  tls:
    trustAnchorRef:
      name: kafka-cluster-1-cluster-ca-cert
      key: ca.crt
      kind: Secret
      storeType: PEM
  nodeIdRanges:
    - name: brokers
      start: 0
      end: 2
---
kind: KafkaService
apiVersion: kroxylicious.io/v1alpha1
metadata:
  namespace: kafka-proxy
  name: kafka-cluster-2
spec:
  bootstrapServers: kafka-cluster-2-kafka-bootstrap.kafka-cluster-2.svc.cluster.local:9093
  tls:
    trustAnchorRef:
      name: kafka-cluster-2-cluster-ca-cert
      key: ca.crt
      kind: Secret
      storeType: PEM
  nodeIdRanges:
    - name: brokers
      start: 0
      end: 2
